<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定制协作</title>
<style>
:root{--ink:#1f2328;--mute:#7a838f;--line:#d9dde3;--bg:#f4f5f7;--teal:#3f7f8c;--red:#b5433a;--green:#3f6f5b;--soft:#eef3f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:8px;height:60px}
header h1{font-size:20px;margin:0 28px 0 0;font-weight:700}
.tab{height:60px;padding:0 22px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-size:17px;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
header .who{margin-left:auto;color:var(--mute)}
main{max-width:1180px;margin:24px auto;padding:0 20px}
button{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 16px;font:inherit;background:#fff;cursor:pointer;color:var(--ink)}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.sm{height:32px;padding:0 12px;font-size:14px}
button.warn{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,textarea{border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:#fff;height:40px}
.add{display:grid;grid-template-columns:200px 1fr auto;gap:10px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
th{background:var(--soft);font-weight:700;border-top:0}
td.n{width:56px;color:var(--mute)}
td.c{width:180px;font-weight:700}
td.o{width:80px;color:var(--mute)}
td.f{width:300px}
td.a{width:150px;white-space:nowrap}
td.need{white-space:pre-wrap}
tr.done td{color:var(--mute)}
tr.done td.c{font-weight:400;text-decoration:line-through}
tr.sep td{background:var(--soft);color:var(--mute);padding:8px 14px;font-size:14px}
.file{display:flex;align-items:center;gap:8px;margin:2px 0}
.file a{color:var(--teal);text-decoration:none;word-break:break-all}
.file .x{color:var(--red);cursor:pointer;font-size:13px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;padding:24px;width:min(520px,92vw);display:grid;gap:12px}
.dlg h2{margin:0;font-size:18px}
.dlg input,.dlg textarea{width:100%}
.dlg textarea{height:120px;padding:8px 12px;resize:vertical}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:10}
</style>
</head>
<body>
<header>
  <h1>定制协作</h1>
  <button class="tab" data-t="A">A 题</button>
  <button class="tab" data-t="B">B 题</button>
  <button class="tab" data-t="C">C 题</button>
  <span class="who" id="who"></span>
  <button id="btnOut" hidden>退出</button>
</header>
<main>
  <div class="add" id="add" hidden>
    <input id="aCustomer" placeholder="客户">
    <input id="aNeed" placeholder="需求">
    <button class="pri" id="aOk">添加</button>
  </div>
  <div id="list"></div>
</main>

<div class="mask" id="mLogin"><div class="dlg">
  <h2>你是谁</h2>
  <input id="lName" placeholder="ltr / qyh / zjl">
  <div class="row"><button class="pri" id="lOk">进入</button></div>
</div></div>

<div class="mask" id="mEdit"><div class="dlg">
  <h2>编辑</h2>
  <input id="eCustomer" placeholder="客户">
  <textarea id="eNeed" placeholder="需求"></textarea>
  <input id="eOwner" placeholder="负责人">
  <div class="row"><button id="eCancel">取消</button><button class="pri" id="eOk">保存</button></div>
</div></div>

<input type="file" id="fileIn" multiple hidden>
<div id="toast"></div>

<script>
const S = { me: '', topic: localStorage.getItem('dz_topic') || 'A', records: [], editing: null, uploadTo: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2400); }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: opt.body && !(opt.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {} });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || '请先登录'); }
  if (!r.ok) throw new Error(j.error || ('出错 ' + r.status));
  return j;
}
function showLogin() { S.me = ''; $('mLogin').classList.add('on'); $('add').hidden = true; $('btnOut').hidden = true; $('who').textContent = ''; $('list').innerHTML = ''; $('lName').focus(); }
async function boot() {
  const me = await api('api/me');
  if (!me.name) return showLogin();
  S.me = me.name; $('mLogin').classList.remove('on');
  $('who').textContent = me.name; $('btnOut').hidden = false; $('add').hidden = false;
  await refresh();
}
async function refresh() {
  try { S.records = (await api('api/data')).records; render(); } catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === S.topic));
  const rows = S.records.filter(r => r.topic === S.topic);
  const todo = rows.filter(r => !r.done).sort((a, b) => a.created.localeCompare(b.created));
  const done = rows.filter(r => r.done).sort((a, b) => b.updated.localeCompare(a.updated));
  if (!rows.length) { $('list').innerHTML = '<div class="empty">还没有客户</div>'; return; }
  let n = 0;
  const tr = r => `<tr class="${r.done ? 'done' : ''}">
    <td class="n">${++n}</td>
    <td class="c">${esc(r.customer)}</td>
    <td class="need">${esc(r.need)}</td>
    <td class="o">${esc(r.owner)}</td>
    <td class="f">${(r.files || []).map(f => `<div class="file"><a href="files/${encodeURIComponent(r.id)}/${encodeURIComponent(f.name)}">${esc(f.name)}</a><span class="x" data-rm="${r.id}" data-name="${esc(f.name)}">删除</span></div>`).join('')}<button class="sm" data-up="${r.id}">上传</button></td>
    <td class="a"><button class="sm" data-done="${r.id}">${r.done ? '恢复' : '完成'}</button> <button class="sm" data-ed="${r.id}">编辑</button> <button class="sm warn" data-del="${r.id}">删除</button></td>
  </tr>`;
  $('list').innerHTML = `<table><tr><th></th><th>客户</th><th>需求</th><th>负责人</th><th>文件包</th><th></th></tr>
    ${todo.map(tr).join('')}
    ${done.length ? `<tr class="sep"><td colspan="6">已完成</td></tr>` + done.map(tr).join('') : ''}
  </table>`;
}
async function addRow() {
  const customer = $('aCustomer').value.trim(), need = $('aNeed').value.trim();
  if (!customer) { toast('客户不能空'); return; }
  try { await api('api/records', { method: 'POST', body: JSON.stringify({ topic: S.topic, customer, need }) }); $('aCustomer').value = ''; $('aNeed').value = ''; await refresh(); }
  catch (e) { toast(e.message); }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('.tab'); if (t) { S.topic = t.dataset.t; localStorage.setItem('dz_topic', S.topic); render(); return; }
  const b = e.target.closest('[data-up],[data-ed],[data-del],[data-rm],[data-done]'); if (!b) return;
  const find = id => S.records.find(r => r.id === id);
  try {
    if (b.dataset.up) { S.uploadTo = b.dataset.up; $('fileIn').value = ''; $('fileIn').click(); }
    else if (b.dataset.done) { const r = find(b.dataset.done); await api('api/records/' + r.id, { method: 'PUT', body: JSON.stringify({ done: !r.done }) }); await refresh(); }
    else if (b.dataset.ed) { const r = find(b.dataset.ed); S.editing = r.id; $('eCustomer').value = r.customer; $('eNeed').value = r.need; $('eOwner').value = r.owner; $('mEdit').classList.add('on'); }
    else if (b.dataset.del) { const r = find(b.dataset.del); if (confirm(`删除 ${r.customer} 这一行和它的文件？`)) { await api('api/records/' + r.id, { method: 'DELETE' }); await refresh(); } }
    else if (b.dataset.rm) { if (confirm('删除文件 ' + b.dataset.name + '？')) { await api('api/records/' + b.dataset.rm + '/files/' + encodeURIComponent(b.dataset.name), { method: 'DELETE' }); await refresh(); } }
  } catch (err) { toast(err.message); }
});
$('fileIn').addEventListener('change', async () => {
  const list = [...$('fileIn').files]; if (!S.uploadTo || !list.length) return;
  const fd = new FormData(); let total = 0;
  for (const f of list) { fd.append('file', f, f.name); total += f.size; }
  if (total > 500 * 1048576) { toast('一次最多传 500 MB'); return; }
  toast('上传中');
  try { await api('api/records/' + S.uploadTo + '/files', { method: 'POST', body: fd }); await refresh(); toast('已上传'); } catch (err) { toast(err.message); }
});
$('eOk').onclick = async () => {
  try { await api('api/records/' + S.editing, { method: 'PUT', body: JSON.stringify({ customer: $('eCustomer').value.trim(), need: $('eNeed').value.trim(), owner: $('eOwner').value.trim() }) }); $('mEdit').classList.remove('on'); await refresh(); }
  catch (e) { toast(e.message); }
};
$('eCancel').onclick = () => $('mEdit').classList.remove('on');
$('aOk').onclick = addRow;
$('aNeed').addEventListener('keydown', e => { if (e.key === 'Enter') addRow(); });
$('lOk').onclick = async () => { try { await api('api/login', { method: 'POST', body: JSON.stringify({ name: $('lName').value.trim() }) }); await boot(); } catch (e) { toast(e.message); } };
$('lName').addEventListener('keydown', e => { if (e.key === 'Enter') $('lOk').click(); });
$('btnOut').onclick = () => { document.cookie = 'dz_sid=; Path=/; Max-Age=0'; showLogin(); };
$('mEdit').addEventListener('click', e => { if (e.target === $('mEdit')) $('mEdit').classList.remove('on'); });
boot();
</script>
</body>
</html>
