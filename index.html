<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定制协作</title>
<style>
:root{--ink:#1f2328;--mute:#6b7480;--line:#d9dde3;--bg:#f4f5f7;--card:#fff;--teal:#3f7f8c;--ochre:#c08552;--purple:#7a6a9b;--red:#b5433a;--green:#3f6f5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:18px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
header .who{margin-left:auto;color:var(--mute)}
main{max-width:1100px;margin:22px auto;padding:0 20px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.bar input[type=text],.bar select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:#fff}
.bar input[type=text]{flex:1;min-width:220px}
button{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 16px;font:inherit;background:#fff;cursor:pointer;color:var(--ink)}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.warn{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
.group{margin:26px 0 10px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.group span{color:var(--mute);font-weight:400;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.card .t{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-weight:400}
.badge.A{color:var(--teal);border-color:var(--teal)}.badge.B{color:var(--green);border-color:var(--green)}.badge.C{color:var(--ink);border-color:var(--ink)}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;color:#fff;font-weight:400}
.pill.待做{background:#8a96a3}.pill.在做{background:var(--ochre)}.pill.待审{background:var(--purple)}.pill.完成{background:var(--green)}
.meta{color:var(--mute);font-size:13px}
.note{white-space:pre-wrap;margin:2px 0 4px}
.files{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.file{display:flex;align-items:center;gap:10px;font-size:14px}
.file a{color:var(--teal);text-decoration:none;cursor:pointer}
.file .x{color:var(--red);cursor:pointer;font-size:12px}
.acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.acts button{height:34px;padding:0 12px;font-size:14px}
.acts select{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;background:#fff}
.log{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
.log h2{font-size:16px;margin:0 0 8px}
.log div{font-size:13px;color:var(--mute);padding:2px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;padding:22px 24px;width:min(560px,92vw);display:grid;gap:12px}
.dlg h2{margin:0 0 4px;font-size:18px}
.dlg label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.dlg input,.dlg select,.dlg textarea{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;width:100%}
.dlg textarea{height:96px;padding:8px 12px;resize:vertical}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:10;max-width:80vw}
.empty{color:var(--mute);text-align:center;padding:60px 0}
</style>
</head>
<body>
<header>
  <h1>定制协作</h1>
  <span id="repoName" class="meta"></span>
  <span class="who" id="who"></span>
  <button id="btnSet">设置</button>
</header>
<main>
  <div class="bar">
    <input type="text" id="q" placeholder="搜题目、版本、负责人">
    <select id="fs"><option value="">全部状态</option><option>待做</option><option>在做</option><option>待审</option><option>完成</option></select>
    <button id="btnReload">刷新</button>
    <button class="pri" id="btnNew">新建定制</button>
  </div>
  <div id="list"><div class="empty">正在读取</div></div>
  <div class="log"><h2>动态</h2><div id="log"></div></div>
</main>

<div class="mask" id="mSet"><div class="dlg">
  <h2>设置</h2>
  <label>GitHub 令牌<input id="sToken" type="password" placeholder="github_pat_…"></label>
  <label>数据仓库<input id="sRepo" type="text" placeholder="Goose666666/dingzhi-sync-data"></label>
  <label>署名<input id="sName" type="text" placeholder="动态里显示的名字"></label>
  <div class="row"><button id="sCancel">取消</button><button class="pri" id="sOk">保存</button></div>
</div></div>

<div class="mask" id="mEdit"><div class="dlg">
  <h2 id="eTitle">新建定制</h2>
  <div class="row2">
    <label>题目<input id="eTopic" type="text" placeholder="2025国赛B题" list="topics"><datalist id="topics"></datalist></label>
    <label>版本<input id="eVer" type="text" placeholder="定制03"></label>
  </div>
  <div class="row2">
    <label>画图模板<select id="eTpl"><option>A 彩色分栏</option><option>B 淡彩强调</option><option>C 黑白流程</option></select></label>
    <label>负责人<input id="eOwner" type="text"></label>
  </div>
  <div class="row2">
    <label>状态<select id="eStatus"><option>待做</option><option>在做</option><option>待审</option><option>完成</option></select></label>
    <label>侧重点<input id="eFocus" type="text" placeholder="换构图、拆模型准备、集中布局"></label>
  </div>
  <label>说明<textarea id="eNote"></textarea></label>
  <div class="row"><button id="eCancel">取消</button><button class="pri" id="eOk">保存</button></div>
</div></div>

<input type="file" id="fileIn" multiple hidden>
<div id="toast"></div>

<script>
const API = 'https://api.github.com';
const DATA_PATH = 'records.json';
const S = {
  token: localStorage.getItem('dz_token') || '',
  repo: localStorage.getItem('dz_repo') || 'Goose666666/dingzhi-sync-data',
  name: localStorage.getItem('dz_name') || '',
  data: { records: [], log: [] },
  sha: null,
  login: '',
  editing: null,
  uploadTo: null,
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toISOString();
const fmt = t => t ? t.replace('T', ' ').slice(0, 16) : '';
const who = () => S.name || S.login || '匿名';
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2600); }

function b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64text(str) { return b64(new TextEncoder().encode(str)); }
function unb64text(str) { const bin = atob(str.replace(/\n/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }

async function gh(path, opt = {}, raw = false) {
  const r = await fetch(API + path, { ...opt, headers: { Authorization: 'Bearer ' + S.token, Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', ...(opt.headers || {}) } });
  if (r.status === 404) return null;
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(r.status + ' ' + (e.message || '')); }
  return raw ? r : r.json();
}
const cpath = p => `/repos/${S.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;

async function loadData() {
  const j = await gh(cpath(DATA_PATH));
  if (!j) { S.data = { records: [], log: [] }; S.sha = null; return; }
  S.data = JSON.parse(unb64text(j.content)); S.sha = j.sha;
  S.data.records ||= []; S.data.log ||= [];
}
async function saveData(mutate, msg) {
  for (let k = 0; k < 3; k++) {
    await loadData();
    mutate(S.data);
    S.data.log.unshift({ at: now(), by: who(), text: msg });
    S.data.log = S.data.log.slice(0, 200);
    try {
      const j = await gh(cpath(DATA_PATH), { method: 'PUT', body: JSON.stringify({ message: msg + ' by ' + who(), content: b64text(JSON.stringify(S.data, null, 2)), sha: S.sha || undefined }) });
      S.sha = j.content.sha; return;
    } catch (e) { if (!/409|422/.test(e.message) || k === 2) throw e; }
  }
}

function render() {
  const q = $('q').value.trim().toLowerCase(), fs = $('fs').value;
  const recs = S.data.records.filter(r => (!fs || r.status === fs) && (!q || [r.topic, r.version, r.owner, r.focus, r.note].join(' ').toLowerCase().includes(q)));
  const topics = [...new Set(S.data.records.map(r => r.topic))];
  $('topics').innerHTML = topics.map(t => `<option value="${esc(t)}">`).join('');
  if (!recs.length) { $('list').innerHTML = `<div class="empty">${S.data.records.length ? '没有符合的记录' : '还没有记录，点右上角新建定制'}</div>`; }
  else {
    const byTopic = {};
    recs.forEach(r => (byTopic[r.topic] ||= []).push(r));
    $('list').innerHTML = Object.entries(byTopic).map(([t, rs]) => `<div class="group">${esc(t)}<span>${rs.length} 版</span></div>` + rs.sort((a, b) => a.version.localeCompare(b.version, 'zh')).map(card).join('')).join('');
  }
  $('log').innerHTML = S.data.log.slice(0, 30).map(l => `<div>${fmt(l.at)} ${esc(l.by)} ${esc(l.text)}</div>`).join('') || '<div>暂无</div>';
}
function card(r) {
  const tpl = (r.template || '').charAt(0);
  const files = (r.files || []).map((f, i) => `<div class="file"><a data-dl="${esc(r.id)}:${i}">${esc(f.name)}</a><span class="meta">${(f.size / 1048576).toFixed(1)} MB ${esc(f.by)} ${fmt(f.at)}</span><span class="x" data-rm="${esc(r.id)}:${i}">删除</span></div>`).join('');
  return `<div class="card" data-id="${esc(r.id)}">
    <div>
      <div class="t">${esc(r.version)} <span class="badge ${tpl}">${esc(r.template)}</span> <span class="pill ${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="meta">负责人 ${esc(r.owner || '未定')} · 侧重 ${esc(r.focus || '无')} · 更新 ${fmt(r.updated)} ${esc(r.updatedBy || '')}</div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      <div class="files">${files}</div>
    </div>
    <div class="acts">
      <select data-st="${esc(r.id)}">${['待做', '在做', '待审', '完成'].map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <button data-up="${esc(r.id)}">上传文件</button>
      <button data-ed="${esc(r.id)}">编辑</button>
      <button class="warn" data-del="${esc(r.id)}">删除</button>
    </div>
  </div>`;
}

async function refresh() {
  if (!S.token) { $('list').innerHTML = '<div class="empty">先在右上角设置里填 GitHub 令牌</div>'; $('who').textContent = ''; return; }
  try {
    if (!S.login) { const u = await gh('/user'); S.login = u.login; }
    $('who').textContent = who();
    $('repoName').textContent = S.repo;
    await loadData(); render();
  } catch (e) { $('list').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; }
}

function openEdit(r) {
  S.editing = r ? r.id : null;
  $('eTitle').textContent = r ? '编辑定制' : '新建定制';
  $('eTopic').value = r?.topic || ''; $('eVer').value = r?.version || ''; $('eTpl').value = r?.template || 'A 彩色分栏';
  $('eOwner').value = r?.owner || (r ? '' : who()); $('eStatus').value = r?.status || '待做'; $('eFocus').value = r?.focus || ''; $('eNote').value = r?.note || '';
  $('mEdit').classList.add('on'); $('eTopic').focus();
}
async function submitEdit() {
  const topic = $('eTopic').value.trim(), version = $('eVer').value.trim();
  if (!topic || !version) { toast('题目和版本不能空'); return; }
  const v = { topic, version, template: $('eTpl').value, owner: $('eOwner').value.trim(), status: $('eStatus').value, focus: $('eFocus').value.trim(), note: $('eNote').value.trim() };
  $('eOk').disabled = true;
  try {
    if (S.editing) {
      await saveData(d => { const r = d.records.find(x => x.id === S.editing); if (r) Object.assign(r, v, { updated: now(), updatedBy: who() }); }, `改了 ${topic} ${version}`);
    } else {
      const id = Date.now().toString(36);
      await saveData(d => { d.records.push({ id, ...v, files: [], created: now(), updated: now(), updatedBy: who() }); }, `新建 ${topic} ${version}`);
    }
    $('mEdit').classList.remove('on'); render(); toast('已保存');
  } catch (e) { toast('保存失败 ' + e.message); }
  $('eOk').disabled = false;
}

async function uploadFiles(rec, list) {
  for (const f of list) {
    if (f.size > 95 * 1048576) { toast(f.name + ' 超过 95 MB，放不进仓库'); continue; }
    toast('上传 ' + f.name);
    const path = `files/${rec.topic}/${rec.version}/${f.name}`;
    const bytes = new Uint8Array(await f.arrayBuffer());
    const old = await gh(cpath(path));
    await gh(cpath(path), { method: 'PUT', body: JSON.stringify({ message: `上传 ${path} by ${who()}`, content: b64(bytes), sha: old?.sha }) });
    await saveData(d => {
      const r = d.records.find(x => x.id === rec.id); if (!r) return;
      r.files = (r.files || []).filter(x => x.path !== path);
      r.files.push({ name: f.name, path, size: f.size, by: who(), at: now() });
      r.updated = now(); r.updatedBy = who();
    }, `上传 ${rec.version} ${f.name}`);
  }
  render(); toast('上传完成');
}
async function download(rec, i) {
  const f = rec.files[i]; toast('下载 ' + f.name);
  const r = await gh(cpath(f.path), {}, true);
  const blob = await r.blob(); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function removeFile(rec, i) {
  const f = rec.files[i];
  if (!confirm('删除文件 ' + f.name + '？')) return;
  const old = await gh(cpath(f.path));
  if (old) await gh(cpath(f.path), { method: 'DELETE', body: JSON.stringify({ message: `删除 ${f.path} by ${who()}`, sha: old.sha }) });
  await saveData(d => { const r = d.records.find(x => x.id === rec.id); if (r) r.files = r.files.filter(x => x.path !== f.path); }, `删除 ${rec.version} ${f.name}`);
  render();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-up],[data-ed],[data-del],[data-dl],[data-rm]');
  if (!b) return;
  const find = id => S.data.records.find(r => r.id === id);
  try {
    if (b.dataset.up) { S.uploadTo = find(b.dataset.up); $('fileIn').value = ''; $('fileIn').click(); }
    else if (b.dataset.ed) openEdit(find(b.dataset.ed));
    else if (b.dataset.del) { const r = find(b.dataset.del); if (confirm(`删除 ${r.topic} ${r.version} 的记录？仓库里的文件不会删`)) { await saveData(d => { d.records = d.records.filter(x => x.id !== r.id); }, `删除记录 ${r.topic} ${r.version}`); render(); } }
    else if (b.dataset.dl) { const [id, i] = b.dataset.dl.split(':'); await download(find(id), +i); }
    else if (b.dataset.rm) { const [id, i] = b.dataset.rm.split(':'); await removeFile(find(id), +i); }
  } catch (err) { toast('失败 ' + err.message); }
});
document.addEventListener('change', async e => {
  const s = e.target.closest('[data-st]'); if (!s) return;
  const r = S.data.records.find(x => x.id === s.dataset.st);
  try { await saveData(d => { const x = d.records.find(y => y.id === r.id); if (x) { x.status = s.value; x.updated = now(); x.updatedBy = who(); } }, `${r.topic} ${r.version} 改为${s.value}`); render(); toast('已改状态'); }
  catch (err) { toast('失败 ' + err.message); }
});
$('fileIn').addEventListener('change', async () => { if (S.uploadTo && $('fileIn').files.length) { try { await uploadFiles(S.uploadTo, [...$('fileIn').files]); } catch (err) { toast('上传失败 ' + err.message); } } });
$('btnSet').onclick = () => { $('sToken').value = S.token; $('sRepo').value = S.repo; $('sName').value = S.name; $('mSet').classList.add('on'); };
$('sCancel').onclick = () => $('mSet').classList.remove('on');
$('sOk').onclick = () => { S.token = $('sToken').value.trim(); S.repo = $('sRepo').value.trim() || S.repo; S.name = $('sName').value.trim(); S.login = '';
  localStorage.setItem('dz_token', S.token); localStorage.setItem('dz_repo', S.repo); localStorage.setItem('dz_name', S.name); $('mSet').classList.remove('on'); refresh(); };
$('btnNew').onclick = () => openEdit(null);
$('eCancel').onclick = () => $('mEdit').classList.remove('on');
$('eOk').onclick = submitEdit;
$('btnReload').onclick = refresh;
$('q').oninput = render; $('fs').onchange = render;
document.querySelectorAll('.mask').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); }));
refresh();
</script>
</body>
</html>
