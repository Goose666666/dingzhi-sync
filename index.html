<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定制协作</title>
<style>
:root{--navy:#0b1220;--navy2:#111a2e;--ink:#0f172a;--mute:#64748b;--line:#e3e8ef;--bg:#f3f5f9;--card:#fff;--acc:#2f6df6;--acc2:#1f4fd8;--ok:#0f9d6e;--red:#d64545;--amber:#d98b1f;--chip:#eef2f8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none}
button{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font:inherit;background:#fff;cursor:pointer;color:var(--ink);transition:.12s}
button:hover{border-color:#c9d2df;background:#fbfcfe}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2)}
button.sm{height:30px;padding:0 11px;font-size:13px;border-radius:7px}
button.ghost{border-color:transparent;background:transparent;color:var(--mute)}
button.ghost:hover{background:var(--chip);color:var(--ink)}
button.warn{color:var(--red)}
button.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
input{border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;background:#fff;height:36px;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,109,246,.15)}
input::placeholder{color:#a3adbd}
/* 布局 */
.app{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 44px)}
aside{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cbd5e1;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:44px;height:calc(100vh - 44px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.3px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#7cc0ff);display:inline-block;box-shadow:0 4px 12px rgba(47,109,246,.45)}
.tab{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:#aab4c5;font-size:14.5px;text-align:left;justify-content:flex-start;position:relative}
.tab:hover{background:rgba(255,255,255,.06);color:#fff;border-color:transparent}
.tab.on{background:rgba(47,109,246,.22);color:#fff;font-weight:600}
.tab .k{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#e2e8f0}
.tab.on .k{background:var(--acc)}
.tab .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 8px;color:#e2e8f0}
.tab .cnt[hidden],.tab .cnt.red[hidden]{display:none}
.tab .cnt.red{position:absolute;top:-4px;right:-4px;margin:0;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;font-weight:700;font-size:12px;box-shadow:0 0 0 2px var(--navy)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.05)}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-transform:uppercase}
.me .nm{color:#fff;font-weight:600;flex:1}
.me button{height:28px;padding:0 10px;font-size:12.5px;background:transparent;border-color:rgba(255,255,255,.18);color:#cbd5e1}
.me button:hover{background:rgba(255,255,255,.08)}
main{padding:26px 34px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--mute);font-size:13px;margin-top:2px}
.add[hidden]{display:none}
.bar{height:44px;background:var(--navy);color:#e2e8f0;display:flex;align-items:center;justify-content:center;gap:28px;font-size:14px;position:sticky;top:0;z-index:6;border-bottom:1px solid rgba(255,255,255,.08)}
.bar .now{font-variant-numeric:tabular-nums;color:#cbd5e1}
.bar .left{font-weight:700;color:#ff8a80}
.bar .left b{font-size:18px;margin:0 2px;color:#fff}
/* 行卡片 */
table{width:100%;border-collapse:separate;border-spacing:0 10px}
th{padding:0 14px 2px;text-align:left;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.4px;text-transform:uppercase}
td{background:var(--card);padding:14px;vertical-align:top;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
tr td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
tr:hover td{box-shadow:0 6px 18px -12px rgba(15,23,42,.25)}
td.n{width:56px;font-weight:700;color:var(--mute);font-size:15px}
td.note{width:220px}
td.note input{width:100%}
td.price{width:120px}
td.price input{width:100%}
td.a,th.a{width:380px;text-align:right;white-space:nowrap}
.steps{display:inline-flex;gap:6px}
.steps button{height:30px;padding:0 12px;font-size:13px;border-radius:999px}
.steps button.on::before{content:"✓ ";font-weight:700}
td.a .del{margin-left:6px}
td.a .pfs{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
td.a .pf{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:12px}
td.a .pf img{height:84px;max-width:132px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#fff}
td.a .pf .broken{display:inline-flex;align-items:center;justify-content:center;height:84px;width:120px;border:1px dashed var(--line);border-radius:8px;color:var(--acc);font-size:13px}
tr.done td{background:#fbfcfe;color:var(--mute)}
tr.done td .file a{color:var(--mute)}
tr.sep td{background:transparent;border:0;padding:6px 14px 0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.4px;text-transform:uppercase;box-shadow:none}
.tree{margin-bottom:8px}
.tree details{margin:2px 0}
.tree summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tree summary::before{content:"▸";width:12px;color:var(--mute)}
.tree details[open]>summary::before{content:"▾"}
.tree .in{padding-left:18px}
.file{display:flex;align-items:center;gap:10px;margin:3px 0;white-space:nowrap}
.file .nm{overflow:hidden;text-overflow:ellipsis;max-width:300px;font-weight:500}
.file .op{color:var(--acc);cursor:pointer}
.file .x,.tree .x{color:var(--red);cursor:pointer;font-size:12.5px}
.file .sz{color:var(--mute);font-size:12.5px}
.zip{padding-left:18px}
.empty{color:var(--mute);text-align:center;padding:70px 0;background:var(--card);border:1px dashed var(--line);border-radius:12px}
/* 汇总 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--mute)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
table.sum{border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.sum th{padding:12px 16px;background:#f8fafc;text-align:right;text-transform:none;letter-spacing:0;font-size:13px}
table.sum td{padding:12px 16px;text-align:right;border:0;border-top:1px solid var(--line);border-radius:0!important}
table.sum td:first-child,table.sum th:first-child{text-align:left;font-weight:600}
table.sum tr.total td{font-weight:700;background:#f8fafc}
table.sum tr:hover td{box-shadow:none}
/* 回收站 */
table.trash td.k{width:70px;color:var(--mute)}
table.trash td.w{width:120px;font-weight:600}
table.trash td.t{width:170px;color:var(--mute)}
table.trash td.a{width:200px}
/* 登录 */
.mask{position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2a4d 0%,var(--navy) 55%);display:none;align-items:center;justify-content:center;z-index:9}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:16px;padding:32px 30px 26px;width:min(380px,92vw);display:grid;gap:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.dlg .brand{padding:0 0 6px;color:var(--ink)}
.dlg input{width:100%;height:42px}
.dlg button{height:42px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:10;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{padding:4px 10px}.tab{width:auto}.me{margin:0 0 0 auto}main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="bar"><span class="now" id="now"></span><span class="left" id="left"></span></div>
<div class="app">
<aside>
  <div class="brand"><i></i>定制协作</div>
  <button class="tab" data-t="A"><span class="k">A</span>A 题<span class="cnt red" id="cA" hidden></span></button>
  <button class="tab" data-t="B"><span class="k">B</span>B 题<span class="cnt red" id="cB" hidden></span></button>
  <button class="tab" data-t="C"><span class="k">C</span>C 题<span class="cnt red" id="cC" hidden></span></button>
  <div class="sep"></div>
  <button class="tab" data-t="S"><span class="k">Σ</span>汇总</button>
  <button class="tab" data-t="T"><span class="k">↺</span>回收站<span class="cnt" id="tcnt" hidden></span></button>
  <div class="me" id="me" hidden><span class="av" id="av"></span><span class="nm" id="who"></span><button id="btnOut">退出</button></div>
</aside>
<main>
  <div class="top"><div><h2 id="title"></h2><div class="sub" id="sub"></div></div>
    <div class="add" id="add" hidden><button class="pri" id="aOk">＋ 添加客户</button></div></div>
  <div id="list"></div>
</main>
</div>

<div class="mask" id="mLogin"><div class="dlg">
  <div class="brand"><i></i>定制协作</div>
  <input id="lName" type="password" placeholder="密码" autocomplete="current-password">
  <button class="pri" id="lOk">进入</button>
</div></div>

<input type="file" id="fileIn" multiple hidden>
<input type="file" id="proofIn" accept="image/*" hidden>
<div id="toast"></div>

<script>
const S = { me: '', topic: localStorage.getItem('dz_topic') || 'A', records: [], trash: [], uploadTo: null, closed: new Set(), zips: {}, proofFor: null };
const FLAGS = [['deposit', '定金', '已付定金'], ['paid', '结账', '已结账'], ['done', '完成', '已完成']];
const TITLES = { A: 'A 题', B: 'B 题', C: 'C 题', S: '汇总', T: '回收站' };
const money = n => (Math.round((n || 0) * 100) / 100).toLocaleString('zh-CN');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const when = t => t ? t.slice(5, 16).replace('T', ' ') : '';
const mb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const PREVIEW = /\.(pdf|png|jpe?g|gif|svg|webp|bmp|txt|md|tex|py|json|csv|log|html?|js|css|bib|m|cls|sty|bat|sh|ya?ml|ini|cfg)$/i;
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2400); }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: opt.body && !(opt.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {} });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || '请先登录'); }
  if (!r.ok) throw new Error(j.error || ('出错 ' + r.status));
  return j;
}
function showLogin() { S.me = ''; $('mLogin').classList.add('on'); $('add').hidden = true; $('me').hidden = true; $('list').innerHTML = ''; $('title').textContent = ''; $('sub').textContent = ''; $('lName').focus(); }
async function boot() {
  const me = await api('api/me');
  if (!me.name) return showLogin();
  S.me = me.name; $('mLogin').classList.remove('on');
  $('who').textContent = me.name; $('av').textContent = me.name.slice(0, 1); $('me').hidden = false;
  await refresh();
}
async function refresh() {
  try { const d = await api('api/data'); S.records = d.records; S.trash = d.trash || []; render(); }
  catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function tree(files) {
  const root = { dirs: {}, files: [] };
  for (const f of files) {
    const parts = f.name.split('/');
    if (parts[0] === '凭证') continue;
    let node = root;
    for (const d of parts.slice(0, -1)) node = node.dirs[d] ||= { dirs: {}, files: [] };
    node.files.push({ ...f, base: parts[parts.length - 1] });
  }
  return root;
}
function fileRow(rid, f) {
  const url = `files/${encodeURIComponent(rid)}/${enc(f.name)}`;
  const isZip = /\.zip$/i.test(f.name);
  const key = rid + '|' + f.name;
  const zip = S.zips[key];
  return `<div class="file">
    ${PREVIEW.test(f.name) ? `<a class="nm" href="${url}?inline=1" target="_blank">${esc(f.base)}</a>` : `<span class="nm">${esc(f.base)}</span>`}
    <span class="sz">${mb(f.size)} · ${esc(f.by || '')} ${when(f.at)}</span>
    <a href="${url}">下载</a>
    ${isZip ? `<span class="op" data-zip="${esc(key)}">${zip ? '收起' : '查看'}</span>` : ''}
    <span class="x" data-rm="${esc(rid)}" data-name="${esc(f.name)}">删除</span>
  </div>${zip ? `<div class="zip">${zip.map(e => `<div class="file"><a class="nm" href="${url}?entry=${encodeURIComponent(e.name)}" ${PREVIEW.test(e.name) ? 'target="_blank"' : ''}>${esc(e.name)}</a><span class="sz">${mb(e.size)}</span></div>`).join('') || '<div class="sz">空的</div>'}</div>` : ''}`;
}
function dirRows(rid, node, prefix) {
  let h = '';
  for (const [d, sub] of Object.entries(node.dirs).sort()) {
    const p = prefix ? prefix + '/' + d : d;
    h += `<details ${S.closed.has(rid + '|' + p) ? '' : 'open'} data-dir="${esc(rid + '|' + p)}"><summary><b>${esc(d)}</b><span class="x" data-rmdir="${esc(rid)}" data-name="${esc(p)}">删除</span></summary><div class="in">${dirRows(rid, sub, p)}</div></details>`;
  }
  for (const f of node.files) h += fileRow(rid, f);
  return h;
}
function renderSummary() {
  const all = S.records, sum = (rs, f) => rs.filter(f || (() => true)).reduce((a, r) => a + (r.price || 0), 0);
  $('sub').textContent = `${all.length} 个客户 · ${all.filter(r => r.done).length} 个已完成`;
  const line = (name, rs) => `<tr class="${name === '合计' ? 'total' : ''}"><td>${name}</td><td>${rs.length}</td><td>${rs.filter(r => r.done).length}</td><td>${money(sum(rs))}</td><td>${money(sum(rs, r => r.paid))}</td><td>${money(sum(rs, r => !r.paid))}</td><td>${rs.filter(r => r.deposit && !r.paid).length}</td></tr>`;
  $('list').innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">定价合计</div><div class="v">${money(sum(all))}<small>元</small></div></div>
      <div class="kpi"><div class="l">已结账</div><div class="v">${money(sum(all, r => r.paid))}<small>元</small></div></div>
      <div class="kpi"><div class="l">未结账</div><div class="v">${money(sum(all, r => !r.paid))}<small>元</small></div></div>
      <div class="kpi"><div class="l">只付了定金</div><div class="v">${all.filter(r => r.deposit && !r.paid).length}<small>个</small></div></div>
    </div>
    <table class="sum"><tr><th></th><th>客户</th><th>已完成</th><th>定价合计</th><th>已结账</th><th>未结账</th><th>只付了定金</th></tr>
    ${['A', 'B', 'C'].map(k => line(k + ' 题', all.filter(r => r.topic === k))).join('')}${line('合计', all)}</table>`;
}
function renderTrash() {
  $('sub').textContent = S.trash.length ? `${S.trash.length} 项` : '';
  if (!S.trash.length) { $('list').innerHTML = '<div class="empty">回收站是空的</div>'; return; }
  const acts = t => `<td class="a"><button class="sm" data-restore="${t.id}">恢复</button> <button class="sm warn" data-purge="${t.id}">彻底删除</button></td>`;
  const row = t => t.kind === 'row'
    ? `<tr><td class="k">客户</td><td class="w">${t.rec.topic} 题 ${t.rec.seq} 号</td><td>${esc(t.rec.note || '')}${t.rec.price ? ' · ' + money(t.rec.price) : ''}${(t.rec.files || []).length ? ' · ' + t.rec.files.length + ' 个文件' : ''}</td><td class="t">${esc(t.by)} ${when(t.at)}</td>${acts(t)}</tr>`
    : `<tr><td class="k">文件</td><td class="w">${t.topic} 题 ${t.seq} 号</td><td>${esc(t.file.name)} <span class="sz">${mb(t.file.size)}</span></td><td class="t">${esc(t.by)} ${when(t.at)}</td>${acts(t)}</tr>`;
  $('list').innerHTML = `<table class="trash"><tr><th></th><th>位置</th><th>内容</th><th>删除</th><th class="a"></th></tr>${S.trash.map(row).join('')}</table>`;
}
const DEADLINE = new Date('2026-09-13T20:00:00+08:00');
function tick() {
  const n = new Date(), pad = x => String(x).padStart(2, '0');
  $('now').textContent = `${n.getFullYear()} 年 ${n.getMonth() + 1} 月 ${n.getDate()} 日 ${'日一二三四五六'[n.getDay()] === '日' ? '星期日' : '星期' + '日一二三四五六'[n.getDay()]} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  let s = Math.floor((DEADLINE - n) / 1000);
  if (s <= 0) { $('left').textContent = '国赛已截止'; return; }
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  $('left').innerHTML = `距国赛截止 9 月 13 日 20:00 还有 <b>${d}</b> 天 <b>${h}</b> 时 <b>${m}</b> 分`;
}
setInterval(tick, 1000); tick();
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === S.topic));
  for (const k of ['A', 'B', 'C']) { const c = S.records.filter(r => r.topic === k && !r.done).length; $('c' + k).hidden = !c; $('c' + k).textContent = c; }
  $('tcnt').hidden = !S.trash.length; $('tcnt').textContent = S.trash.length;
  $('title').textContent = TITLES[S.topic];
  $('add').hidden = !S.me || S.topic === 'S' || S.topic === 'T';
  if (S.topic === 'S') return renderSummary();
  if (S.topic === 'T') return renderTrash();
  const rows = S.records.filter(r => r.topic === S.topic);
  const todo = rows.filter(r => !r.done).sort((a, b) => a.created.localeCompare(b.created));
  const done = rows.filter(r => r.done).sort((a, b) => b.updated.localeCompare(a.updated));
  $('sub').textContent = rows.length ? `${todo.length} 个在做 · ${done.length} 个已完成` : '';
  if (!rows.length) { $('list').innerHTML = '<div class="empty">还没有客户</div>'; return; }
  let n = 0;
  const tr = r => `<tr class="${r.done ? 'done' : ''}">
    <td class="n">${String(++n).padStart(2, '0')}</td>
    <td class="note"><input value="${esc(r.note || '')}" placeholder="备注" data-note="${r.id}"></td>
    <td class="price"><input type="number" min="0" step="1" value="${r.price || ''}" placeholder="定价" data-price="${r.id}"></td>
    <td><div class="tree">${dirRows(r.id, tree(r.files || []), '')}</div><button class="sm" data-up="${r.id}">上传</button></td>
    <td class="a"><span class="steps">${FLAGS.map(([k, off, on]) => `<button class="${r[k] ? 'on' : ''}" data-flag="${k}" data-id="${r.id}">${r[k] ? on : off}</button>`).join('')}</span><button class="sm ghost warn del" data-del="${r.id}">删除</button>
      <div class="pfs">${FLAGS.filter(([k]) => r.proof && r.proof[k]).map(([k, off, on]) => `<a class="pf" target="_blank" href="files/${encodeURIComponent(r.id)}/${enc(r.proof[k])}?inline=1"><img src="files/${encodeURIComponent(r.id)}/${enc(r.proof[k])}?inline=1" alt="${on}" onerror="this.outerHTML='<span class=broken>打开图片</span>'"><span>${on}</span></a>`).join('')}</div></td>
  </tr>`;
  $('list').innerHTML = `<table><tr><th></th><th>备注</th><th>定价</th><th>文件</th><th class="a">状态</th></tr>${todo.map(tr).join('')}${done.length ? `<tr class="sep"><td colspan="5">已完成</td></tr>` + done.map(tr).join('') : ''}</table>`;
}
async function upload(rid, list) {
  const fd = new FormData(); let total = 0;
  for (const f of list) { fd.append('file', f, f.name); total += f.size; }
  if (total > 500 * 1048576) { toast('一次最多传 500 MB'); return; }
  toast('上传中 ' + mb(total));
  try { await api('api/records/' + rid + '/files', { method: 'POST', body: fd }); await refresh(); toast('已上传'); } catch (err) { toast(err.message); }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('.tab'); if (t) { S.topic = t.dataset.t; localStorage.setItem('dz_topic', S.topic); render(); return; }
  const b = e.target.closest('[data-up],[data-del],[data-rm],[data-rmdir],[data-flag],[data-zip],[data-restore],[data-purge]'); if (!b) return;
  const find = id => S.records.find(r => r.id === id);
  try {
    if (b.dataset.up) { S.uploadTo = b.dataset.up; $('fileIn').value = ''; $('fileIn').click(); }
    else if (b.dataset.flag) {
      const r = find(b.dataset.id), k = b.dataset.flag;
      if (r[k]) { if (confirm('取消这个勾？')) { await api('api/records/' + r.id, { method: 'PUT', body: JSON.stringify({ [k]: false }) }); await refresh(); } }
      else { S.proofFor = { rid: r.id, k }; $('proofIn').value = ''; $('proofIn').click(); }
    }
    else if (b.dataset.del) { await api('api/records/' + b.dataset.del, { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
    else if (b.dataset.rm) { e.preventDefault(); await api('api/records/' + b.dataset.rm + '/files/' + enc(b.dataset.name), { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
    else if (b.dataset.rmdir) { e.preventDefault(); await api('api/records/' + b.dataset.rmdir + '/files/' + enc(b.dataset.name) + '?dir=1', { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
    else if (b.dataset.restore) { await api('api/trash/' + b.dataset.restore + '/restore', { method: 'POST', body: '{}' }); await refresh(); toast('已恢复'); }
    else if (b.dataset.purge) { if (confirm('彻底删除，不能再找回？')) { await api('api/trash/' + b.dataset.purge, { method: 'DELETE' }); await refresh(); } }
    else if (b.dataset.zip) {
      const key = b.dataset.zip;
      if (S.zips[key]) { delete S.zips[key]; render(); return; }
      const [rid, name] = key.split('|');
      S.zips[key] = (await api('api/records/' + rid + '/zip?name=' + encodeURIComponent(name))).entries; render();
    }
  } catch (err) { toast(err.message); }
});
document.addEventListener('toggle', e => { const d = e.target.closest('details[data-dir]'); if (!d) return; d.open ? S.closed.delete(d.dataset.dir) : S.closed.add(d.dataset.dir); }, true);
document.addEventListener('change', async e => {
  const i = e.target.closest('[data-note],[data-price]'); if (!i) return;
  const id = i.dataset.note || i.dataset.price, body = i.dataset.note ? { note: i.value } : { price: Number(i.value) || 0 };
  try { await api('api/records/' + id, { method: 'PUT', body: JSON.stringify(body) }); const r = S.records.find(r => r.id === id); if (r) Object.assign(r, body); } catch (err) { toast(err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-note],[data-price]')) e.target.blur(); });
$('proofIn').addEventListener('change', async () => {
  const f = $('proofIn').files[0]; if (!S.proofFor || !f) return;
  const fd = new FormData(); fd.append('file', f, f.name);
  toast('上传凭证');
  try { await api('api/records/' + S.proofFor.rid + '/proof/' + S.proofFor.k, { method: 'POST', body: fd }); await refresh(); } catch (err) { toast(err.message); }
});
$('fileIn').addEventListener('change', () => { if (S.uploadTo && $('fileIn').files.length) upload(S.uploadTo, [...$('fileIn').files]); });
$('aOk').onclick = async () => { try { await api('api/records', { method: 'POST', body: JSON.stringify({ topic: S.topic }) }); await refresh(); } catch (e) { toast(e.message); } };
$('lOk').onclick = async () => { try { await api('api/login', { method: 'POST', body: JSON.stringify({ name: $('lName').value.trim() }) }); await boot(); } catch (e) { toast(e.message); } };
$('lName').addEventListener('keydown', e => { if (e.key === 'Enter') $('lOk').click(); });
$('btnOut').onclick = () => { document.cookie = 'dz_sid=; Path=/; Max-Age=0'; showLogin(); };
boot();
</script>
</body>
