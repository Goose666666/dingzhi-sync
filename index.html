<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定制协作</title>
<style>
:root{--ink:#1f2328;--mute:#7a838f;--line:#d9dde3;--bg:#f4f5f7;--teal:#3f7f8c;--red:#b5433a;--green:#3f6f5b;--soft:#eef3f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:8px;height:60px}
header h1{font-size:20px;margin:0 28px 0 0;font-weight:700}
.tab{height:60px;padding:0 22px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-size:17px;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
header .who{margin-left:auto;color:var(--mute)}
main{max-width:1240px;margin:24px auto;padding:0 20px}
button{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 16px;font:inherit;background:#fff;cursor:pointer;color:var(--ink)}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button.sm{height:32px;padding:0 12px;font-size:14px}
button.warn{color:var(--red)}
button.on{background:var(--green);border-color:var(--green);color:#fff}
input{border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:#fff;height:40px}
.add{display:flex;justify-content:flex-end;margin-bottom:18px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{padding:12px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td.n{width:56px;font-weight:700}
td.note{width:230px}
td.note input{width:100%;height:36px}
td.price{width:120px}
td.price input{width:100%;height:36px}
td.a{width:340px;white-space:nowrap;text-align:right}
td.a .pf{display:inline-block;margin:6px 0 0 4px;color:var(--teal);text-decoration:none;font-size:14px}
table.sum td,table.sum th{padding:12px 14px;text-align:right;border-top:1px solid var(--line)}
table.sum th{background:var(--soft);border-top:0;font-weight:700}
table.sum td:first-child,table.sum th:first-child{text-align:left;font-weight:700}
table.sum tr.total td{font-weight:700}
tr.done td{color:var(--mute)}
tr.sep td{background:var(--soft);color:var(--mute);padding:8px 14px;font-size:14px}
.tree{margin-bottom:8px}
.tree details{margin:2px 0}
.tree summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.tree summary::before{content:"▸";width:12px;color:var(--mute)}
.tree details[open]>summary::before{content:"▾"}
.tree .in{padding-left:20px}
.file{display:flex;align-items:center;gap:8px;margin:3px 0;flex-wrap:wrap}
.file a,.file .op{color:var(--teal);text-decoration:none;cursor:pointer}
.file .x,.tree .x{color:var(--red);cursor:pointer;font-size:13px}
.file .sz{color:var(--mute);font-size:13px}
.zip{padding-left:20px}
.btns{display:flex;gap:8px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;padding:24px;width:min(520px,92vw);display:grid;gap:12px}
.dlg input{width:100%}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:10}
</style>
</head>
<body>
<header>
  <h1>定制协作</h1>
  <button class="tab" data-t="A">A 题</button>
  <button class="tab" data-t="B">B 题</button>
  <button class="tab" data-t="C">C 题</button>
  <button class="tab" data-t="S">汇总</button>
  <span class="who" id="who"></span>
  <button id="btnOut" hidden>退出</button>
</header>
<main>
  <div class="add" id="add" hidden><button class="pri" id="aOk">添加客户</button></div>
  <div id="list"></div>
</main>

<div class="mask" id="mLogin"><div class="dlg">
  <input id="lName" type="password" placeholder="密码" autocomplete="current-password">
  <div class="row"><button class="pri" id="lOk">进入</button></div>
</div></div>

<input type="file" id="fileIn" multiple hidden>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="proofIn" accept="image/*" hidden>
<div id="toast"></div>

<script>
const S = { me: '', topic: localStorage.getItem('dz_topic') || 'A', records: [], uploadTo: null, closed: new Set(), zips: {}, proofFor: null };
const FLAGS = [['deposit', '未付定金', '已付定金'], ['paid', '未结账', '已结账'], ['done', '未完成', '已完成']];
const money = n => (Math.round((n || 0) * 100) / 100).toLocaleString('zh-CN');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const mb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const PREVIEW = /\.(pdf|png|jpe?g|gif|svg|webp|bmp|txt|md|tex|py|json|csv|log|html?|js|css|bib|m|cls|sty|bat|sh|ya?ml|ini|cfg)$/i;
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2400); }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: opt.body && !(opt.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {} });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || '请先登录'); }
  if (!r.ok) throw new Error(j.error || ('出错 ' + r.status));
  return j;
}
function showLogin() { S.me = ''; $('mLogin').classList.add('on'); $('add').hidden = true; $('btnOut').hidden = true; $('who').textContent = ''; $('list').innerHTML = ''; $('lName').focus(); }
async function boot() {
  const me = await api('api/me');
  if (!me.name) return showLogin();
  S.me = me.name; $('mLogin').classList.remove('on');
  $('who').textContent = me.name; $('btnOut').hidden = false; $('add').hidden = false;
  await refresh();
}
async function refresh() {
  try { S.records = (await api('api/data')).records; render(); } catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function tree(files) {
  const root = { dirs: {}, files: [] };
  for (const f of files) {
    const parts = f.name.split('/'); let node = root;
    for (const d of parts.slice(0, -1)) node = node.dirs[d] ||= { dirs: {}, files: [] };
    node.files.push({ ...f, base: parts[parts.length - 1] });
  }
  return root;
}
function fileRow(rid, f) {
  const url = `files/${encodeURIComponent(rid)}/${enc(f.name)}`;
  const isZip = /\.zip$/i.test(f.name);
  const key = rid + '|' + f.name;
  const zip = S.zips[key];
  return `<div class="file">
    ${PREVIEW.test(f.name) ? `<a href="${url}?inline=1" target="_blank">${esc(f.base)}</a>` : `<span>${esc(f.base)}</span>`}
    <span class="sz">${mb(f.size)}</span>
    <a href="${url}">下载</a>
    ${isZip ? `<span class="op" data-zip="${esc(key)}">${zip ? '收起' : '查看'}</span>` : ''}
    <span class="x" data-rm="${esc(rid)}" data-name="${esc(f.name)}">删除</span>
  </div>${zip ? `<div class="zip">${zip.map(e => `<div class="file">${PREVIEW.test(e.name) ? `<a href="${url}?entry=${encodeURIComponent(e.name)}" target="_blank">${esc(e.name)}</a>` : `<a href="${url}?entry=${encodeURIComponent(e.name)}">${esc(e.name)}</a>`}<span class="sz">${mb(e.size)}</span></div>`).join('') || '<div class="sz">空的</div>'}</div>` : ''}`;
}
function dirRows(rid, node, prefix) {
  let h = '';
  for (const [d, sub] of Object.entries(node.dirs).sort()) {
    const p = prefix ? prefix + '/' + d : d;
    h += `<details ${S.closed.has(rid + '|' + p) ? '' : 'open'} data-dir="${esc(rid + '|' + p)}"><summary><b>${esc(d)}</b><span class="x" data-rmdir="${esc(rid)}" data-name="${esc(p)}">删除</span></summary><div class="in">${dirRows(rid, sub, p)}</div></details>`;
  }
  for (const f of node.files) h += fileRow(rid, f);
  return h;
}
function renderSummary() {
  const line = (name, rs) => `<tr class="${name === '合计' ? 'total' : ''}"><td>${name}</td><td>${rs.length}</td><td>${rs.filter(r => r.done).length}</td><td>${money(rs.reduce((a, r) => a + (r.price || 0), 0))}</td><td>${money(rs.filter(r => r.paid).reduce((a, r) => a + (r.price || 0), 0))}</td><td>${money(rs.filter(r => !r.paid).reduce((a, r) => a + (r.price || 0), 0))}</td><td>${rs.filter(r => r.deposit && !r.paid).length}</td></tr>`;
  $('list').innerHTML = `<table class="sum"><tr><th></th><th>客户</th><th>已完成</th><th>定价合计</th><th>已结账</th><th>未结账</th><th>只付了定金</th></tr>
    ${['A', 'B', 'C'].map(k => line(k + ' 题', S.records.filter(r => r.topic === k))).join('')}${line('合计', S.records)}</table>`;
}
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === S.topic));
  $('add').hidden = !S.me || S.topic === 'S';
  if (S.topic === 'S') return renderSummary();
  const rows = S.records.filter(r => r.topic === S.topic);
  const todo = rows.filter(r => !r.done).sort((a, b) => a.created.localeCompare(b.created));
  const done = rows.filter(r => r.done).sort((a, b) => b.updated.localeCompare(a.updated));
  if (!rows.length) { $('list').innerHTML = ''; return; }
  let n = 0;
  const tr = r => `<tr class="${r.done ? 'done' : ''}">
    <td class="n">${++n}</td>
    <td class="note"><input value="${esc(r.note || '')}" data-note="${r.id}"></td>
    <td class="price"><input type="number" min="0" step="1" value="${r.price || ''}" data-price="${r.id}"></td>
    <td><div class="tree">${dirRows(r.id, tree(r.files || []), '')}</div>
      <div class="btns"><button class="sm" data-up="${r.id}">上传文件</button><button class="sm" data-updir="${r.id}">上传文件夹</button></div></td>
    <td class="a">${FLAGS.map(([k, off, on]) => `<button class="sm ${r[k] ? 'on' : ''}" data-flag="${k}" data-id="${r.id}">${r[k] ? on : off}</button> `).join('')}<button class="sm warn" data-del="${r.id}">删除</button>
      <div>${FLAGS.filter(([k]) => r.proof && r.proof[k]).map(([k, off, on]) => `<a class="pf" target="_blank" href="files/${encodeURIComponent(r.id)}/${enc(r.proof[k])}?inline=1">${on}凭证</a>`).join('')}</div></td>
  </tr>`;
  $('list').innerHTML = `<table>${todo.map(tr).join('')}${done.length ? `<tr class="sep"><td colspan="5">已完成</td></tr>` + done.map(tr).join('') : ''}</table>`;
}
async function upload(rid, list) {
  const fd = new FormData(); let total = 0;
  for (const f of list) { fd.append('file', f, f.webkitRelativePath || f.name); total += f.size; }
  if (total > 500 * 1048576) { toast('一次最多传 500 MB'); return; }
  toast('上传中 ' + mb(total));
  try { await api('api/records/' + rid + '/files', { method: 'POST', body: fd }); await refresh(); toast('已上传'); } catch (err) { toast(err.message); }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('.tab'); if (t) { S.topic = t.dataset.t; localStorage.setItem('dz_topic', S.topic); render(); return; }
  const b = e.target.closest('[data-up],[data-updir],[data-del],[data-rm],[data-rmdir],[data-flag],[data-zip]'); if (!b) return;
  const find = id => S.records.find(r => r.id === id);
  try {
    if (b.dataset.up) { S.uploadTo = b.dataset.up; $('fileIn').value = ''; $('fileIn').click(); }
    else if (b.dataset.updir) { S.uploadTo = b.dataset.updir; $('dirIn').value = ''; $('dirIn').click(); }
    else if (b.dataset.flag) {
      const r = find(b.dataset.id), k = b.dataset.flag;
      if (r[k]) { if (confirm('取消这个勾？')) { await api('api/records/' + r.id, { method: 'PUT', body: JSON.stringify({ [k]: false }) }); await refresh(); } }
      else { S.proofFor = { rid: r.id, k }; $('proofIn').value = ''; $('proofIn').click(); }
    }
    else if (b.dataset.del) { if (confirm('删除这一行和它的文件？')) { await api('api/records/' + b.dataset.del, { method: 'DELETE' }); await refresh(); } }
    else if (b.dataset.rm) { e.preventDefault(); if (confirm('删除 ' + b.dataset.name + '？')) { await api('api/records/' + b.dataset.rm + '/files/' + enc(b.dataset.name), { method: 'DELETE' }); await refresh(); } }
    else if (b.dataset.rmdir) { e.preventDefault(); if (confirm('删除文件夹 ' + b.dataset.name + ' 和里面的全部文件？')) { await api('api/records/' + b.dataset.rmdir + '/files/' + enc(b.dataset.name) + '?dir=1', { method: 'DELETE' }); await refresh(); } }
    else if (b.dataset.zip) {
      const key = b.dataset.zip;
      if (S.zips[key]) { delete S.zips[key]; render(); return; }
      const [rid, name] = key.split('|');
      S.zips[key] = (await api('api/records/' + rid + '/zip?name=' + encodeURIComponent(name))).entries; render();
    }
  } catch (err) { toast(err.message); }
});
document.addEventListener('toggle', e => { const d = e.target.closest('details[data-dir]'); if (!d) return; d.open ? S.closed.delete(d.dataset.dir) : S.closed.add(d.dataset.dir); }, true);
document.addEventListener('change', async e => {
  const i = e.target.closest('[data-note],[data-price]'); if (!i) return;
  const id = i.dataset.note || i.dataset.price, body = i.dataset.note ? { note: i.value } : { price: Number(i.value) || 0 };
  try { await api('api/records/' + id, { method: 'PUT', body: JSON.stringify(body) }); const r = S.records.find(r => r.id === id); if (r) Object.assign(r, body); } catch (err) { toast(err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-note],[data-price]')) e.target.blur(); });
$('fileIn').addEventListener('change', () => { if (S.uploadTo && $('fileIn').files.length) upload(S.uploadTo, [...$('fileIn').files]); });
$('proofIn').addEventListener('change', async () => {
  const f = $('proofIn').files[0]; if (!S.proofFor || !f) return;
  const fd = new FormData(); fd.append('file', f, f.name);
  toast('上传凭证');
  try { await api('api/records/' + S.proofFor.rid + '/proof/' + S.proofFor.k, { method: 'POST', body: fd }); await refresh(); } catch (err) { toast(err.message); }
});
$('dirIn').addEventListener('change', () => { if (S.uploadTo && $('dirIn').files.length) upload(S.uploadTo, [...$('dirIn').files]); });
$('aOk').onclick = async () => { try { await api('api/records', { method: 'POST', body: JSON.stringify({ topic: S.topic }) }); await refresh(); } catch (e) { toast(e.message); } };
$('lOk').onclick = async () => { try { await api('api/login', { method: 'POST', body: JSON.stringify({ name: $('lName').value.trim() }) }); await boot(); } catch (e) { toast(e.message); } };
$('lName').addEventListener('keydown', e => { if (e.key === 'Enter') $('lOk').click(); });
$('btnOut').onclick = () => { document.cookie = 'dz_sid=; Path=/; Max-Age=0'; showLogin(); };
boot();
</script>
</body>
</html>
