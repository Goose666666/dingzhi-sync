<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定制协作</title>
<style>
:root{--navy:#0b1220;--navy2:#111a2e;--ink:#0f172a;--mute:#64748b;--line:#e3e8ef;--bg:#f3f5f9;--card:#fff;--acc:#2f6df6;--acc2:#1f4fd8;--ok:#0f9d6e;--red:#d64545;--amber:#d98b1f;--chip:#eef2f8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none}
button{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font:inherit;background:#fff;cursor:pointer;color:var(--ink);transition:.12s}
button:hover{border-color:#c9d2df;background:#fbfcfe}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2)}
button.sm{height:30px;padding:0 11px;font-size:13px;border-radius:7px}
button.ghost{border-color:transparent;background:transparent;color:var(--mute)}
button.ghost:hover{background:var(--chip);color:var(--ink)}
button.warn{color:var(--red)}
button.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
input{border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;background:#fff;height:36px;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,109,246,.15)}
input::placeholder{color:#a3adbd}
/* 布局 */
.app{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 44px)}
aside{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cbd5e1;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:44px;height:calc(100vh - 44px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.3px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#7cc0ff);display:inline-block;box-shadow:0 4px 12px rgba(47,109,246,.45)}
.tab{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:#aab4c5;font-size:14.5px;text-align:left;justify-content:flex-start;position:relative}
.tab:hover{background:rgba(255,255,255,.06);color:#fff;border-color:transparent}
.tab.on{background:rgba(47,109,246,.22);color:#fff;font-weight:600}
.tab .k{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#e2e8f0}
.tab.on .k{background:var(--acc)}
.tab .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 8px;color:#e2e8f0}
.tab .cnt[hidden],.tab .cnt.red[hidden]{display:none}
.tab .cnt.red{position:absolute;top:-4px;right:-4px;margin:0;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;font-weight:700;font-size:12px;box-shadow:0 0 0 2px var(--navy)}
.sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.05)}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-transform:uppercase}
.me .nm{color:#fff;font-weight:600;flex:1}
.me button{height:28px;padding:0 10px;font-size:12.5px;background:transparent;border-color:rgba(255,255,255,.18);color:#cbd5e1}
.me button:hover{background:rgba(255,255,255,.08)}
main{padding:26px 34px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--mute);font-size:13px;margin-top:2px}
.add[hidden]{display:none}
.bar{height:44px;background:var(--navy);color:#e2e8f0;display:flex;align-items:center;justify-content:center;gap:28px;font-size:14px;position:sticky;top:0;z-index:6;border-bottom:1px solid rgba(255,255,255,.08)}
.bar .now{font-variant-numeric:tabular-nums;color:#cbd5e1}
.bar .left{font-weight:700;color:#ff8a80}
.bar .left b{font-size:18px;margin:0 2px;color:#fff}
/* 行卡片 */
table{width:100%;border-collapse:separate;border-spacing:0 10px}
th{padding:0 14px 2px;text-align:left;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.4px;text-transform:uppercase}
td{background:var(--card);padding:14px;vertical-align:top;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
tr td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
tr:hover td{box-shadow:0 6px 18px -12px rgba(15,23,42,.25)}
td.n{width:62px;font-weight:700;color:var(--mute);font-size:15px}
.tp{display:block;margin-top:8px;height:26px;padding:0 4px;font:inherit;font-size:12px;font-weight:400;color:var(--mute);border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
td.note{width:330px}
td.note input{width:100%}
td.price{width:120px}
td.price input{width:100%}
td.a,th.a{width:380px;text-align:right;white-space:nowrap}
.steps{display:inline-flex;gap:6px}
.steps button{height:30px;padding:0 12px;font-size:13px;border-radius:999px}
td.note .nw{display:flex;align-items:center;gap:8px}
td.note .nw input{flex:1;min-width:0}
.gd{flex:none}
.gd{height:28px;width:28px;padding:0;font-size:15px;line-height:1;border-radius:999px;border:1px solid var(--line);color:#c3ccd8;background:#fff}
.gd:hover{border-color:#f0cccc;color:var(--red);background:#fff5f5}
.gd.on{width:auto;padding:0 11px;font-size:12.5px;background:var(--red);border-color:var(--red);color:#fff;font-weight:600;white-space:nowrap}
tr.gold td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.gdtag{font-size:11.5px;color:#fff;background:var(--red);border-radius:999px;padding:1px 7px;font-weight:600;white-space:nowrap}
.steps button.on::before{content:"✓ ";font-weight:700}
td.a .del{margin-left:6px}
td.a .pfs{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
td.a .pf{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:12px}
td.a .pf img{height:84px;max-width:132px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#fff}
td.a .pf .broken{display:inline-flex;align-items:center;justify-content:center;height:84px;width:120px;border:1px dashed var(--line);border-radius:8px;color:var(--acc);font-size:13px}
tr.done td{background:#fbfcfe;color:var(--mute)}
tr.done td .file a{color:var(--mute)}
tr.sep td{background:transparent;border:0;padding:6px 14px 0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.4px;text-transform:uppercase;box-shadow:none}
.tree{margin-bottom:8px}
.tree details{margin:2px 0}
.tree summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tree summary::before{content:"▸";width:12px;color:var(--mute)}
.tree details[open]>summary::before{content:"▾"}
.tree .in{padding-left:18px}
.file{display:flex;align-items:center;gap:10px;margin:3px 0;white-space:nowrap}
.file .nm{overflow:hidden;text-overflow:ellipsis;max-width:300px;font-weight:500}
.file .op{color:var(--acc);cursor:pointer}
.file .x,.tree .x{color:var(--red);cursor:pointer;font-size:12.5px}
.file .sz{color:var(--mute);font-size:12.5px}
.zip{padding-left:18px}
.empty{color:var(--mute);text-align:center;padding:70px 0;background:var(--card);border:1px dashed var(--line);border-radius:12px}
/* 汇总 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--mute)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
table.sum{border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.sum th{padding:12px 16px;background:#f8fafc;text-align:right;text-transform:none;letter-spacing:0;font-size:13px}
table.sum td{padding:12px 16px;text-align:right;border:0;border-top:1px solid var(--line);border-radius:0!important}
table.sum td:first-child,table.sum th:first-child{text-align:left;font-weight:600}
table.sum tr.total td{font-weight:700;background:#f8fafc}
table.sum tr:hover td{box-shadow:none}
/* 回收站 */
table.trash td.k{width:70px;color:var(--mute)}
table.trash td.w{width:120px;font-weight:600}
table.trash td.t{width:170px;color:var(--mute)}
table.trash td.a{width:200px}
/* 操作记录 */
.steps{align-items:flex-start}
.st{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.st i{font-style:normal;font-size:11.5px;color:var(--mute);white-space:nowrap}
.hist{margin-top:10px;font-size:12px;color:var(--mute);line-height:1.7}
.hist .add{color:var(--ink);font-weight:600}
.logs{display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:120px 60px 1fr 220px;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.lg .t{color:var(--mute);font-size:13px}
.lg .by{font-weight:600}
.lg .wh{color:var(--mute);font-size:13px;text-align:right;word-break:break-all}
/* 拖进来 */
[data-flag].drop{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,109,246,.2)}
tr.drop td{box-shadow:inset 0 0 0 2px var(--acc)}
tr.drop{box-shadow:inset 0 0 0 2px var(--acc)}
#list.drop{outline:2px dashed var(--acc);outline-offset:8px;border-radius:12px}
/* 优秀论文 */
.pps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pp .cv{display:block;height:190px;overflow:hidden;background:#eef2f8;border-bottom:1px solid var(--line)}
.pp .cv img{width:100%;display:block}
.pp .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pp .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pp .hd b{font-size:15px}
.pp .tg{font-size:12px;color:var(--acc);background:#eef4ff;border-radius:999px;padding:2px 9px}
.pp .ds{color:var(--mute);line-height:1.6}
.pp .mt{font-size:12.5px;color:var(--mute);margin-top:auto}
.pp .ops{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.pp .ops a{padding:5px 12px;border:1px solid var(--line);border-radius:8px;color:var(--acc);cursor:pointer}
.pp .ops a:hover{background:var(--chip)}
/* 技能 */
.sks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.sk .hd{display:flex;align-items:center;gap:9px;font-size:15px}
.sk .hd .ic{width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#5b8cf8,#2f6df6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.sk .ds{color:var(--mute);line-height:1.55}
.sk .mt{font-size:12.5px;color:var(--mute);margin-top:auto}
.sk .ops{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sk .ops a{padding:5px 12px;border:1px solid var(--line);border-radius:8px;color:var(--acc);cursor:pointer}
.sk .ops a:hover{background:var(--chip)}
.docs{display:flex;gap:8px;margin-bottom:14px}
.docs .doc{padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
/* 文件库 */
.crumb{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:14px}
.crumb a{color:var(--mute);cursor:pointer}
.crumb a:hover{color:var(--acc)}
.crumb b{color:var(--ink)}
.crumb .sp{color:#b6c0cf}
.libbar{display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;position:relative;min-height:112px;display:flex;flex-direction:column;gap:6px;transition:.12s}
.tile:hover{border-color:#c9d2df;box-shadow:0 8px 20px -14px rgba(15,23,42,.35)}
.tile .ic{width:40px;height:32px;border-radius:6px;position:relative;flex:none}
.tile.dir .ic{background:linear-gradient(180deg,#ffd35c,#f5b91e);border-radius:4px 6px 6px 6px}
.tile.dir .ic::before{content:"";position:absolute;left:0;top:-6px;width:18px;height:8px;background:#f5b91e;border-radius:3px 3px 0 0}
.tile.f .ic{background:#eef2f8;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--mute);width:32px;height:38px;border-radius:5px}
.tile.f.pdf .ic{color:#d64545;border-color:#f3c4c4;background:#fff5f5}
.tile.f.zip .ic{color:#8a5a12;border-color:#f0dcb0;background:#fff9ea}
.tile.f.tex .ic,.tile.f.py .ic{color:var(--acc);border-color:#c7d8fb;background:#f2f6ff}
.tile .nm{font-weight:600;word-break:break-all;line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tile .mt{font-size:12px;color:var(--mute);margin-top:auto}
.tile .ops{position:absolute;top:8px;right:8px;left:8px;display:none;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tile:hover .ops{display:flex}
.tile .ops span{font-size:12px;padding:2px 7px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--acc)}
.tile .ops span.x{color:var(--red)}
.tile .ops span.ok{color:var(--ok)}
/* 定制稿：审核状态 */
.zone{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:700;font-size:15px}
.zone.first{margin-top:0}
.zone .n{font-size:12px;padding:1px 9px;border-radius:999px;color:#fff;line-height:18px}
.zone.todo{color:#9a5b05}.zone.todo .n{background:var(--amber)}
.zone.done{color:#0b6e4e}.zone.done .n{background:var(--ok)}
.tile.rv0{background:#fffaf0;border-color:#f1dcb6}.tile.rv0 .ic{background:linear-gradient(180deg,#f7c76a,#e39a1f)}.tile.rv0 .ic::before{background:#e39a1f}
.tile.rv1{background:#f2fbf6;border-color:#bfe4d1}.tile.rv1 .ic{background:linear-gradient(180deg,#5ecb9d,#149a67)}.tile.rv1 .ic::before{background:#149a67}
.tile .rv{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tile.rv0 .rv{color:var(--amber)}.tile.rv1 .rv{color:var(--ok)}
/* 冲国奖：整个文件夹变红，压过上面两种状态色 */
.tile.dir.gold{background:#fff4f4;border-color:#eeb4b4}
.tile.dir.gold .ic{background:linear-gradient(180deg,#ef7f7f,#d64545)}
.tile.dir.gold .ic::before{background:#d64545}
.tile.dir.gold .nm{color:var(--red)}
.tile.dir.gold .rv{color:#c96a6a}
.zipbox{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
/* 从文件库选 */
.mask.pick{background:rgba(15,23,42,.45)}
.dlg.wide{width:min(720px,94vw)}
.pklist{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.pk:first-child{border-top:0}
.pk:hover{background:var(--hover)}
.dlg .pk input[type=checkbox]{width:16px;height:16px;margin:0;flex:none;accent-color:var(--acc)}
.dlg .crumb{margin-bottom:10px}
.pk .ico{width:22px;height:18px;border-radius:3px;background:linear-gradient(180deg,#ffd35c,#f5b91e)}
.pk .ico.f{background:#eef2f8;border:1px solid var(--line);width:16px;height:20px}
.pk .nm{flex:1;font-weight:500}
.pk .go{color:var(--acc);font-size:13px}
.pk .sz{color:var(--mute);font-size:12.5px}
/* 登录 */
.mask{position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2a4d 0%,var(--navy) 55%);display:none;align-items:center;justify-content:center;z-index:9}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:16px;padding:32px 30px 26px;width:min(380px,92vw);display:grid;gap:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.dlg .brand{padding:0 0 6px;color:var(--ink)}
.dlg input{width:100%;height:42px}
.dlg button{height:42px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:10;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.scroll{overflow-x:auto}
@media(max-width:760px){
  /* 顶栏：一行放不下就换行，跟着页面走不粘住 */
  .bar{position:static;height:auto;min-height:38px;flex-wrap:wrap;gap:2px 16px;padding:7px 12px;font-size:12.5px;line-height:1.4}
  .bar .left b{font-size:15px}
  /* 侧栏变成顶上一条横向标签，滑得动 */
  .app{grid-template-columns:1fr;min-height:auto}
  aside{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:6px;padding:9px 12px;z-index:5;-webkit-overflow-scrolling:touch}
  aside::-webkit-scrollbar{display:none}
  .brand{display:none}
  .sep{display:none}
  .tab{width:auto;flex:none;height:34px;padding:0 12px;margin:0;font-size:13.5px;border-radius:999px;background:rgba(255,255,255,.06)}
  .tab .k{display:none}
  .tab .cnt.red{top:-3px;right:-3px;min-width:17px;height:17px;font-size:11px}
  .me{margin:0 0 0 auto;flex:none;padding:5px 8px;gap:7px}
  .me .av{width:26px;height:26px;font-size:12px}
  main{padding:16px 13px 44px}
  .top{flex-wrap:wrap;gap:10px}
  .top h2{font-size:19px}
  /* 客户行改成一张张卡片 */
  table.rows{border-spacing:0}
  table.rows .hd{display:none}
  table.rows tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;position:relative}
  table.rows td{display:block;width:auto;background:transparent;border:0;padding:5px 0}
  table.rows tr td:first-child,table.rows tr td:last-child{border:0;border-radius:0}
  table.rows td.n{position:absolute;top:14px;right:14px;padding:0;display:flex;align-items:center;gap:8px}
  table.rows td.n .tp{margin:0}
  table.rows td.note{padding-right:30px}
  table.rows td.a{text-align:left;white-space:normal;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
  table.rows td.a .pfs{flex-basis:100%;margin-top:4px}
  table.rows tr.done{background:#fbfcfe}
  table.rows tr.gold{box-shadow:inset 3px 0 0 var(--red)}
  table.rows tr.gold td:first-child{box-shadow:none}
  table.rows tr.sep{background:transparent;border:0;padding:2px 0 0;margin:0}
  table.rows tr.sep td{padding:0}
  table.rows tr:hover td{box-shadow:none}
  .steps{display:flex;flex-wrap:wrap;gap:8px}
  td.a .del{margin-left:0;margin-top:8px}
  td.a .pfs{justify-content:flex-start}
  .file .nm{max-width:none;overflow:hidden;text-overflow:ellipsis}
  button{white-space:nowrap}
  /* 汇总和回收站：一行一张卡，不用横着拖 */
  table.sum,table.trash{width:100%;border-spacing:0}
  table.sum .hd,table.trash .hd{display:none}
  table.sum tr,table.trash tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  table.sum td,table.trash td{display:block;background:transparent;border:0;padding:4px 0}

  table.trash td.a{width:auto;display:flex;gap:8px;margin-top:8px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:13px 14px}
  .kpi .v{font-size:22px}
  /* 文件库：触屏没有悬停，操作按钮直接显示 */

  .tile{min-height:0}
  .tile .ops{position:static;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tile .ops span,.tile .ops a span{font-size:12px;padding:3px 9px}
  .crumb{flex-wrap:wrap;row-gap:8px}
  .libbar{flex-wrap:wrap}
  .sks,.pps{grid-template-columns:1fr}
  .lg{grid-template-columns:1fr auto;gap:2px 10px;padding:11px 13px}
  .lg .t{order:3;grid-column:1}
  .lg .by{order:1}
  .lg .w{order:2;grid-column:2;text-align:right}
  .lg .wh{order:4;grid-column:2;text-align:right}
  .pp .cv{height:150px}
  .dlg.wide{width:96vw;padding:20px 16px 18px}
  .pklist{max-height:56vh}
}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{padding:4px 10px}.tab{width:auto}.me{margin:0 0 0 auto}main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}}

</div>

</div></div>

<input type="file" id="proofIn" accept="image/*" hidden>

<input type="file" id="libDirIn" webkitdirectory multiple hidden>
<div id="toast"></div>

<script>
const S = { me: '', topic: 'A', records: [], trash: [], uploadTo: null, closed: new Set(), zips: {}, proofFor: null };
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^([ABCSTLKPG])(?:\/(.*))?$/);
  if (m) { S.topic = m[1]; S.libPath = m[1] === 'L' ? (m[2] || '') : ''; }
  else { S.topic = localStorage.getItem('dz_topic') || 'A'; S.libPath = ''; }
}
function hashOf() { return '#' + S.topic + (S.topic === 'L' && S.libPath ? '/' + S.libPath : ''); }
function go(topic, libPath) {
  S.topic = topic; if (libPath !== undefined) S.libPath = libPath; S.libZip = null;
  localStorage.setItem('dz_topic', topic);
  if (location.hash !== hashOf()) history.pushState({ h: hashOf() }, '', hashOf());
  refresh();
}
window.addEventListener('popstate', () => {
  if (S.pick) { S.pick = null; $('mPick').classList.remove('on'); return; }
  readHash(); refresh();
});
const FLAGS = [['deposit', '定金', '已付定金'], ['paid', '结账', '已结账'], ['done', '完成', '已完成']];
const TITLES = { A: 'A 题', B: 'B 题', C: 'C 题', S: '汇总', T: '回收站', G: '记录', L: '文件库', K: '技能', P: '优秀论文' };
S.libPath = ''; S.lib = null; S.libZip = null; readHash(); history.replaceState({ h: hashOf() }, '', hashOf());
const money = n => (Math.round((n || 0) * 100) / 100).toLocaleString('zh-CN');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const when = t => t ? t.slice(5, 16).replace('T', ' ') : '';
const mb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const PREVIEW = /\.(pdf|png|jpe?g|gif|svg|webp|bmp|txt|md|tex|py|json|csv|log|html?|js|css|bib|m|cls|sty|bat|sh|ya?ml|ini|cfg)$/i;
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2400); }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: opt.body && !(opt.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {} });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || '请先登录'); }
  if (!r.ok) throw new Error(j.error || ('出错 ' + r.status));
  return j;
}
function showLogin() { S.me = ''; $('mLogin').classList.add('on'); $('add').hidden = true; $('me').hidden = true; $('list').innerHTML = ''; $('title').textContent = ''; $('sub').textContent = ''; $('lName').focus(); }
async function boot() {
  const me = await api('api/me');
  if (!me.name) return showLogin();
  S.me = me.name; $('mLogin').classList.remove('on');
  $('who').textContent = me.name; $('av').textContent = me.name.slice(0, 1); $('me').hidden = false;
  await refresh();
}
async function refresh() {
  try { const d = await api('api/data'); S.records = d.records; S.trash = d.trash || []; S.log = d.log || []; render(); }
  catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function tree(files) {
  const root = { dirs: {}, files: [] };
  for (const f of files) {
    const parts = f.name.split('/');
    if (parts[0] === '凭证') continue;
    let node = root;
    for (const d of parts.slice(0, -1)) node = node.dirs[d] ||= { dirs: {}, files: [] };
    node.files.push({ ...f, base: parts[parts.length - 1] });
  }
  return root;
}
function fileRow(rid, f) {
  const url = `files/${encodeURIComponent(rid)}/${enc(f.name)}`;
  const isZip = /\.zip$/i.test(f.name);
  const key = rid + '|' + f.name;
  const zip = S.zips[key];
  return `<div class="file">
    ${PREVIEW.test(f.name) ? `<a class="nm" href="${url}?inline=1" target="_blank">${esc(f.base)}</a>` : `<span class="nm">${esc(f.base)}</span>`}
    <span class="sz">${mb(f.size)} · ${esc(f.by || '')} ${when(f.at)}</span>
    <a href="${url}">下载</a>
    ${isZip ? `<span class="op" data-zip="${esc(key)}">${zip ? '收起' : '查看'}</span>` : ''}
    <span class="x" data-rm="${esc(rid)}" data-name="${esc(f.name)}">删除</span>
  </div>${zip ? `<div class="zip">${zip.map(e => `<div class="file"><a class="nm" href="${url}?entry=${encodeURIComponent(e.name)}" ${PREVIEW.test(e.name) ? 'target="_blank"' : ''}>${esc(e.name)}</a><span class="sz">${mb(e.size)}</span></div>`).join('') || '<div class="sz">空的</div>'}</div>` : ''}`;
}
function dirRows(rid, node, prefix) {
  let h = '';
  for (const [d, sub] of Object.entries(node.dirs).sort()) {
    const p = prefix ? prefix + '/' + d : d;
    h += `<details ${S.closed.has(rid + '|' + p) ? '' : 'open'} data-dir="${esc(rid + '|' + p)}"><summary><b>${esc(d)}</b><span class="x" data-rmdir="${esc(rid)}" data-name="${esc(p)}">删除</span></summary><div class="in">${dirRows(rid, sub, p)}</div></details>`;
  }
  for (const f of node.files) h += fileRow(rid, f);
  return h;
}
function renderSummary() {
  const all = S.records, sum = (rs, f) => rs.filter(f || (() => true)).reduce((a, r) => a + (r.price || 0), 0);
  $('sub').textContent = `${all.length} 个客户 · ${all.filter(r => r.done).length} 个已完成`;
  const line = (name, rs) => `<tr class="${name === '合计' ? 'total' : ''}"><td class="w">${name}</td><td data-l="客户">${rs.length}</td><td data-l="已完成">${rs.filter(r => r.done).length}</td><td data-l="定价合计">${money(sum(rs))}</td><td data-l="已结账">${money(sum(rs, r => r.paid))}</td><td data-l="未结账">${money(sum(rs, r => !r.paid))}</td><td data-l="只付了定金">${rs.filter(r => r.deposit && !r.paid).length}</td></tr>`;
  $('list').innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">定价合计</div><div class="v">${money(sum(all))}<small>元</small></div></div>
      <div class="kpi"><div class="l">已结账</div><div class="v">${money(sum(all, r => r.paid))}<small>元</small></div></div>
      <div class="kpi"><div class="l">未结账</div><div class="v">${money(sum(all, r => !r.paid))}<small>元</small></div></div>
      <div class="kpi"><div class="l">只付了定金</div><div class="v">${all.filter(r => r.deposit && !r.paid).length}<small>个</small></div></div>
    </div>
    <div class="scroll"><table class="sum"><tr class="hd"><th></th><th>客户</th><th>已完成</th><th>定价合计</th><th>已结账</th><th>未结账</th><th>只付了定金</th></tr>
    ${['A', 'B', 'C'].map(k => line(k + ' 题', all.filter(r => r.topic === k))).join('')}${line('合计', all)}</table></div>`;
}
function renderLog() {
  const rows = S.log || [];
  $('sub').textContent = rows.length ? `${rows.length} 条` : '';
  if (!rows.length) { $('list').innerHTML = '<div class="empty">还没有记录</div>'; return; }
  $('list').innerHTML = `<div class="logs">${rows.map(x => `<div class="lg">
    <span class="t">${when(x.at)}</span><span class="by">${esc(x.by)}</span>
    <span class="w">${esc(x.what)}</span><span class="wh">${esc(x.where || '')}</span></div>`).join('')}</div>`;
}
function renderTrash() {
  $('sub').textContent = S.trash.length ? `${S.trash.length} 项` : '';
  if (!S.trash.length) { $('list').innerHTML = '<div class="empty">回收站是空的</div>'; return; }
  const acts = t => `<td class="a"><button class="sm" data-restore="${t.id}">恢复</button> <button class="sm warn" data-purge="${t.id}">彻底删除</button></td>`;
  const row = t => t.kind === 'lib'
    ? `<tr><td class="k">文件库</td><td class="w">${esc(t.path.split('/')[0])}</td><td>${esc(t.path)}${t.isdir ? ' （文件夹）' : ' <span class="sz">' + mb(t.size) + '</span>'}</td><td class="t">${esc(t.by)} ${when(t.at)}</td>${acts(t)}</tr>`
    : t.kind === 'row'
    ? `<tr><td class="k">客户</td><td class="w">${t.rec.topic} 题 ${t.rec.seq} 号</td><td>${esc(t.rec.note || '')}${t.rec.price ? ' · ' + money(t.rec.price) : ''}${(t.rec.files || []).length ? ' · ' + t.rec.files.length + ' 个文件' : ''}</td><td class="t">${esc(t.by)} ${when(t.at)}</td>${acts(t)}</tr>`
    : `<tr><td class="k">文件</td><td class="w">${t.topic} 题 ${t.seq} 号</td><td>${esc(t.file.name)} <span class="sz">${mb(t.file.size)}</span></td><td class="t">${esc(t.by)} ${when(t.at)}</td>${acts(t)}</tr>`;
  $('list').innerHTML = `<div class="scroll"><table class="trash"><tr class="hd"><th></th><th>位置</th><th>内容</th><th>删除</th><th class="a"></th></tr>${S.trash.map(row).join('')}</table></div>`;
}
const DEADLINE = new Date('2026-09-13T20:00:00+08:00');
function tick() {
  const n = new Date(), pad = x => String(x).padStart(2, '0');
  $('now').textContent = `${n.getFullYear()} 年 ${n.getMonth() + 1} 月 ${n.getDate()} 日 ${'日一二三四五六'[n.getDay()] === '日' ? '星期日' : '星期' + '日一二三四五六'[n.getDay()]} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;

}
setInterval(tick, 1000); tick();
async function loadLib() {
  try { S.lib = await api('api/lib?path=' + encodeURIComponent(S.libPath)); } catch (e) { S.libPath = ''; S.lib = await api('api/lib?path='); history.replaceState({ h: hashOf() }, '', hashOf()); }
  renderLib();
}
async function loadPapers() {
  S.papers = await api('api/papers');

}
function renderPapers() {

  const card = x => {

}
function renderSkills() {

function renderLib() {

    <span style="flex:1"></span><div class="libbar">${d.path ? `<button class="sm" id="libUp">上传文件</button><button class="sm" id="libUpDir">上传文件夹</button><button class="sm" id="libMk">新建文件夹</button>` : ''}</div></div>`;

    return `<div class="tile dir ${RV ? (x.review ? 'rv1' : 'rv0') : ''}${x.gold ? ' gold' : ''}" data-go="${esc(p)}"><div class="ic"></div><div class="nm">${esc(x.name)}</div>${rvLine}<div class="mt">${x.count} 项</div>${parts.length && !FIXED.includes(p) ? `<div class="ops">${gdOp}${rvOp}<span data-lmv="${esc(p)}">改名</span><span class="x" data-ldel="${esc(p)}">删除</span></div>` : ''}</div>`;
  };

  let body;

    body = `<div class="zone todo first">未审核<span class="n">${todo.length}</span></div><div class="grid">${todo.map(dirTile).join('')}</div>
      <div class="zone done">已审核<span class="n">${done.length}</span></div><div class="grid">${done.map(dirTile).join('')}</div>`
      + (d.files.length || zipBox ? `<div class="grid" style="margin-top:22px">${d.files.map(fileTile).join('')}${zipBox}</div>` : '');
  } else {
    body = `<div class="grid">${d.dirs.map(dirTile).join('')}${d.files.map(fileTile).join('')}${zipBox}</div>` + (!d.dirs.length && !d.files.length ? '<div class="empty" style="margin-top:12px">这个文件夹是空的</div>' : '');
  }
  $('list').innerHTML = crumb + body;
}
S.pick = null;
async function openPick(rid) {
  S.pick = { rid, path: '', sel: new Map() };
  $('mPick').classList.add('on');
  history.pushState({ h: hashOf(), pick: 1 }, '', hashOf());
  await loadPick();
}
function closePick() { S.pick = null; $('mPick').classList.remove('on'); if (history.state && history.state.pick) history.back(); }
async function loadPick() {
  const d = await api('api/lib?path=' + encodeURIComponent(S.pick.path));
  const parts = d.path ? d.path.split('/') : [];
  $('pkCrumb').innerHTML = `<a data-pgo="">文件库</a>${parts.map((p, i) => `<span class="sp">/</span>${i === parts.length - 1 ? `<b>${esc(p)}</b>` : `<a data-pgo="${esc(parts.slice(0, i + 1).join('/'))}">${esc(p)}</a>`}`).join('')}`;
  const item = (x, isDir) => { const p = d.path ? d.path + '/' + x.name : x.name; return `<div class="pk" ${isDir ? `data-pgo="${esc(p)}"` : `data-ptog="${esc(p)}"`}>${!d.path && isDir ? '<span style="width:16px"></span>' : `<input type="checkbox" data-psel="${esc(p)}" ${S.pick.sel.has(p) ? 'checked' : ''}>`}<span class="ico ${isDir ? '' : 'f'}"></span><span class="nm">${esc(x.name)}</span>${isDir ? `<span class="sz">${x.count} 项</span><span class="go">打开</span>` : `<span class="sz">${mb(x.size)}</span>`}</div>`; };
  $('pkList').innerHTML = d.dirs.map(x => item(x, true)).join('') + d.files.map(x => item(x, false)).join('') || '<div class="pk"><span class="sz">这个文件夹是空的</span></div>';
  $('pkSel').textContent = S.pick.sel.size ? `已选 ${S.pick.sel.size} 项` : '';
}
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === S.topic));
  for (const k of ['A', 'B', 'C']) { const c = S.records.filter(r => r.topic === k && !r.done).length; $('c' + k).hidden = !c; $('c' + k).textContent = c; }
  $('tcnt').hidden = !S.trash.length; $('tcnt').textContent = S.trash.length;
  $('title').textContent = TITLES[S.topic];
  $('add').hidden = !S.me || S.topic !== 'A' && S.topic !== 'B' && S.topic !== 'C';
  if (S.topic === 'L') return loadLib();
  if (S.topic === 'K') return loadSkills();
  if (S.topic === 'P') return loadPapers();
  if (S.topic === 'S') return renderSummary();
  if (S.topic === 'T') return renderTrash();
  if (S.topic === 'G') return renderLog();
  const rows = S.records.filter(r => r.topic === S.topic);
  const first = (a, b) => (b.gold ? 1 : 0) - (a.gold ? 1 : 0);        // 冲国奖的排在最前面
  const todo = rows.filter(r => !r.done).sort((a, b) => first(a, b) || a.created.localeCompare(b.created));
  const done = rows.filter(r => r.done).sort((a, b) => first(a, b) || b.updated.localeCompare(a.updated));
  $('sub').textContent = rows.length ? `${todo.length} 个在做 · ${done.length} 个已完成` : '';
  if (!rows.length) { $('list').innerHTML = '<div class="empty">还没有客户</div>'; return; }
  let n = 0;
  const actOf = (r, k) => {
    const a = (r.acts || {})[k];
    if (a) return a;
    const x = (S.log || []).find(y => y.rid === r.id && y.what.indexOf(FLAGS.find(f => f[0] === k)[1]) >= 0);
    return x ? { by: x.by, at: x.at } : { by: r.updatedBy || '', at: r.updated };
  };
  const hist = r => {
    const c = (r.acts || {}).created || { by: r.owner || '', at: r.created };
    const xs = (S.log || []).filter(x => x.rid === r.id && x.what !== '加了客户' && x.what !== '加了一行').slice(0, 5);
    const add = c.by ? `<div class="add">${esc(c.by)} 加了客户 · ${when(c.at)}</div>` : '';
    return `<div class="hist">${xs.map(x => `<div>${esc(x.by)} ${esc(x.what)} · ${when(x.at)}</div>`).join('')}${add}</div>`;
  };
  const tr = r => `<tr class="${r.done ? 'done' : ''}${r.gold ? ' gold' : ''}" data-row="${r.id}">
    <td class="n">${String(++n).padStart(2, '0')}<select class="tp" data-topic="${r.id}">${['A', 'B', 'C'].map(k => `<option value="${k}"${k === r.topic ? ' selected' : ''}>${k} 题</option>`).join('')}</select></td>
    <td class="note"><div class="nw"><button class="gd ${r.gold ? 'on' : ''}" data-gold="${r.id}" title="冲国奖">${r.gold ? '冲国奖' : '☆'}</button><input value="${esc(r.note || '')}" placeholder="备注" data-note="${r.id}"></div>${hist(r)}</td>
    <td class="price"><input type="number" min="0" step="1" value="${r.price || ''}" placeholder="定价" data-price="${r.id}"></td>
    <td><div class="tree">${dirRows(r.id, tree(r.files || []), '')}</div><button class="sm" data-up="${r.id}">上传</button> <button class="sm" data-pick="${r.id}">从文件库选</button></td>
    <td class="a"><span class="steps">${FLAGS.map(([k, off, on]) => `<span class="st"><button class="${r[k] ? 'on' : ''}" data-flag="${k}" data-id="${r.id}">${r[k] ? on : off}</button>${r[k] ? `<i>${esc(actOf(r, k).by)} ${when(actOf(r, k).at)}</i>` : ''}</span>`).join('')}</span><button class="sm ghost warn del" data-del="${r.id}">删除</button>
      <div class="pfs">${FLAGS.filter(([k]) => r.proof && r.proof[k]).map(([k, off, on]) => `<a class="pf" target="_blank" href="files/${encodeURIComponent(r.id)}/${enc(r.proof[k])}?inline=1"><img src="files/${encodeURIComponent(r.id)}/${enc(r.proof[k])}?inline=1" alt="${on}" onerror="this.outerHTML='<span class=broken>打开图片</span>'"><span>${on}</span></a>`).join('')}</div></td>
  </tr>`;
  $('list').innerHTML = `<table class="rows"><tr class="hd"><th></th><th>备注</th><th>定价</th><th>文件</th><th class="a">状态</th></tr>${todo.map(tr).join('')}${done.length ? `<tr class="sep"><td colspan="5">已完成</td></tr>` + done.map(tr).join('') : ''}</table>`;
}
async function upload(rid, list) {
  const fd = new FormData(); let total = 0;
  for (const f of list) { fd.append('file', f, f.name); total += f.size; }
  if (total > 500 * 1048576) { toast('一次最多传 500 MB'); return; }
  toast('上传中 ' + mb(total));
  try { await api('api/records/' + rid + '/files', { method: 'POST', body: fd }); await refresh(); toast('已上传'); } catch (err) { toast(err.message); }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('.tab'); if (t) { go(t.dataset.t); return; }
  const gd = e.target.closest('[data-gold]');
  if (gd) {
    const r = S.records.find(x => x.id === gd.dataset.gold);
    try { await api('api/records/' + gd.dataset.gold, { method: 'PUT', body: JSON.stringify({ gold: !(r && r.gold) }) }); await refresh(); } catch (err) { toast(err.message); }
    return;
  }
  if (e.target.closest('#libUp')) { $('libIn').value = ''; $('libIn').click(); return; }
  if (e.target.closest('#libUpDir')) { $('libDirIn').value = ''; $('libDirIn').click(); return; }
  if (e.target.closest('#libMk')) { const name = prompt('文件夹名字'); if (name && name.trim()) { try { await api('api/lib/mkdir', { method: 'POST', body: JSON.stringify({ path: S.libPath, name: name.trim() }) }); await loadLib(); } catch (err) { toast(err.message); } } return; }
  const lb = e.target.closest('[data-gd],[data-rv],[data-lmv],[data-ldel],[data-lzip],[data-go],[data-open]');
  if (lb) {
    try {
      if (lb.dataset.gd !== undefined) { e.stopPropagation(); const on = lb.dataset.on === '1'; await api('api/lib/gold', { method: 'POST', body: JSON.stringify({ path: lb.dataset.gd, on }) }); await loadLib(); toast(on ? '已标冲国奖' : '已取消'); }
      else if (lb.dataset.lmv !== undefined) {
        e.stopPropagation();
        const old = lb.dataset.lmv.split('/').pop(), name = prompt('新名字', old);
        if (name && name.trim() && name.trim() !== old) { await api('api/lib/rename', { method: 'POST', body: JSON.stringify({ path: lb.dataset.lmv, name: name.trim() }) }); await loadLib(); toast('已改名'); }
      }
      else if (lb.dataset.rv !== undefined) { e.stopPropagation(); const on = lb.dataset.on === '1'; await api('api/lib/review', { method: 'POST', body: JSON.stringify({ path: lb.dataset.rv, on }) }); await loadLib(); toast(on ? '已确认审核' : '已撤销审核'); }
      else if (lb.dataset.ldel !== undefined) { e.stopPropagation(); await api('api/lib?path=' + encodeURIComponent(lb.dataset.ldel), { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
      else if (lb.dataset.lzip !== undefined) { e.stopPropagation(); S.libZip = S.libZip && S.libZip.path === lb.dataset.lzip ? null : { path: lb.dataset.lzip, entries: (await api('api/lib/zip?path=' + encodeURIComponent(lb.dataset.lzip))).entries }; renderLib(); }
      else if (lb.dataset.go !== undefined) { go('L', lb.dataset.go); }
      else if (lb.dataset.open !== undefined) { const p = lb.dataset.open; window.open('lib/' + enc(p) + (PREVIEW.test(p) ? '?inline=1' : ''), PREVIEW.test(p) ? '_blank' : '_self'); }
    } catch (err) { toast(err.message); }
    return;
  }
  if (S.pick) {
    if (e.target.matches('[data-psel]')) return;
    const g = e.target.closest('[data-pgo]'); if (g) { e.preventDefault(); S.pick.path = g.dataset.pgo; await loadPick(); return; }
    const tg = e.target.closest('[data-ptog]'); if (tg) { const ck = tg.querySelector('[data-psel]'); ck.checked = !ck.checked; ck.dispatchEvent(new Event('change', { bubbles: true })); return; }
    if (e.target.id === 'pkCancel' || e.target === $('mPick')) { closePick(); return; }
    if (e.target.id === 'pkOk') {
      const paths = [...S.pick.sel.keys()]; if (!paths.length) { toast('先勾选'); return; }
      try { const j = await api('api/records/' + S.pick.rid + '/fromlib', { method: 'POST', body: JSON.stringify({ paths }) }); closePick(); await refresh(); toast('放进来 ' + j.files.length + ' 个文件'); } catch (err) { toast(err.message); }
      return;
    }
  }
  const pk = e.target.closest('[data-pick]'); if (pk) { openPick(pk.dataset.pick); return; }
  const b = e.target.closest('[data-up],[data-del],[data-rm],[data-rmdir],[data-flag],[data-zip],[data-restore],[data-purge]'); if (!b) return;
  const find = id => S.records.find(r => r.id === id);
  try {
    if (b.dataset.up) { S.uploadTo = b.dataset.up; $('fileIn').value = ''; $('fileIn').click(); }
    else if (b.dataset.flag) {
      const r = find(b.dataset.id), k = b.dataset.flag;
      if (r[k]) { if (confirm('取消这个勾？')) { await api('api/records/' + r.id, { method: 'PUT', body: JSON.stringify({ [k]: false }) }); await refresh(); } }
      else { S.proofFor = { rid: r.id, k }; $('proofIn').value = ''; $('proofIn').click(); }
    }
    else if (b.dataset.del) { await api('api/records/' + b.dataset.del, { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
    else if (b.dataset.rm) { e.preventDefault(); await api('api/records/' + b.dataset.rm + '/files/' + enc(b.dataset.name), { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
    else if (b.dataset.rmdir) { e.preventDefault(); await api('api/records/' + b.dataset.rmdir + '/files/' + enc(b.dataset.name) + '?dir=1', { method: 'DELETE' }); await refresh(); toast('已放进回收站'); }
    else if (b.dataset.restore) { await api('api/trash/' + b.dataset.restore + '/restore', { method: 'POST', body: '{}' }); await refresh(); toast('已恢复'); }
    else if (b.dataset.purge) { if (confirm('彻底删除，不能再找回？')) { await api('api/trash/' + b.dataset.purge, { method: 'DELETE' }); await refresh(); } }
    else if (b.dataset.zip) {
      const key = b.dataset.zip;
      if (S.zips[key]) { delete S.zips[key]; render(); return; }
      const [rid, name] = key.split('|');
      S.zips[key] = (await api('api/records/' + rid + '/zip?name=' + encodeURIComponent(name))).entries; render();
    }
  } catch (err) { toast(err.message); }
});
document.addEventListener('toggle', e => { const d = e.target.closest('details[data-dir]'); if (!d) return; d.open ? S.closed.delete(d.dataset.dir) : S.closed.add(d.dataset.dir); }, true);
document.addEventListener('change', async e => {
  const ck = e.target.closest('[data-psel]'); if (ck && S.pick) { ck.checked ? S.pick.sel.set(ck.dataset.psel, 1) : S.pick.sel.delete(ck.dataset.psel); $('pkSel').textContent = S.pick.sel.size ? `已选 ${S.pick.sel.size} 项` : ''; return; }
  const tp = e.target.closest('[data-topic]');
  if (tp) {
    try { await api('api/records/' + tp.dataset.topic, { method: 'PUT', body: JSON.stringify({ topic: tp.value }) }); await refresh(); toast('已挪到 ' + tp.value + ' 题'); }
    catch (err) { toast(err.message); }
    return;
  }
  const i = e.target.closest('[data-note],[data-price]'); if (!i) return;
  const id = i.dataset.note || i.dataset.price, body = i.dataset.note ? { note: i.value } : { price: Number(i.value) || 0 };
  try { await api('api/records/' + id, { method: 'PUT', body: JSON.stringify(body) }); const r = S.records.find(r => r.id === id); if (r) Object.assign(r, body); } catch (err) { toast(err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-note],[data-price]')) e.target.blur(); });
// 拖进来就传：图片拖到三个勾上算凭证，拖到客户卡片上进这一行的文件包，文件库页拖进当前文件夹
let dropEl = null;
function markDrop(el) {
  if (dropEl === el) return;
  if (dropEl) dropEl.classList.remove('drop');
  dropEl = el;
  if (el) el.classList.add('drop');
}
function dropTarget(t) {
  if (!t || !t.closest) return null;
  return t.closest('[data-flag]') || t.closest('tr[data-row]')
    || (S.topic === 'L' && S.lib && S.lib.path ? $('list') : null);
}
document.addEventListener('dragover', e => {
  if (!S.me || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  markDrop(dropTarget(e.target));
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) markDrop(null); });
document.addEventListener('drop', async e => {
  const files = [...((e.dataTransfer || {}).files || [])];
  if (!files.length) return;
  e.preventDefault();
  const el = dropTarget(e.target);
  markDrop(null);
  if (!el || !S.me) return;
  if (el.dataset && el.dataset.flag) {
    const img = files.find(f => (f.type || '').startsWith('image/'));
    if (!img) { toast('凭证要图片'); return; }
    const fd = new FormData(); fd.append('file', img, img.name);
    try { await api('api/records/' + el.dataset.id + '/proof/' + el.dataset.flag, { method: 'POST', body: fd }); await refresh(); toast('已存凭证'); }
    catch (err) { toast(err.message); }
    return;
  }
  if (el.dataset && el.dataset.row) return upload(el.dataset.row, files);
  return libUpload(files);
});
$('proofIn').addEventListener('change', async () => {
  const f = $('proofIn').files[0]; if (!S.proofFor || !f) return;
  const fd = new FormData(); fd.append('file', f, f.name);
  toast('上传凭证');
  try { await api('api/records/' + S.proofFor.rid + '/proof/' + S.proofFor.k, { method: 'POST', body: fd }); await refresh(); } catch (err) { toast(err.message); }
});
async function libUpload(list) {
  if (!list.length) return;
  const fd = new FormData(); let total = 0;
  for (const f of list) { fd.append('file', f, f.webkitRelativePath || f.name); total += f.size; }
  if (total > 500 * 1048576) { toast('一次最多传 500 MB'); return; }
  toast('上传中 ' + mb(total));
  try { await api('api/lib/upload?path=' + encodeURIComponent(S.libPath), { method: 'POST', body: fd }); await loadLib(); toast('已上传'); } catch (err) { toast(err.message); }
}
$('libIn').addEventListener('change', () => libUpload([...$('libIn').files]));
$('libDirIn').addEventListener('change', () => libUpload([...$('libDirIn').files]));
$('fileIn').addEventListener('change', () => { if (S.uploadTo && $('fileIn').files.length) upload(S.uploadTo, [...$('fileIn').files]); });
$('aOk').onclick = async () => { try { await api('api/records', { method: 'POST', body: JSON.stringify({ topic: S.topic }) }); await refresh(); } catch (e) { toast(e.message); } };
$('lOk').onclick = async () => { try { await api('api/login', { method: 'POST', body: JSON.stringify({ name: $('lName').value.trim() }) }); await boot(); } catch (e) { toast(e.message); } };
$('lName').addEventListener('keydown', e => { if (e.key === 'Enter') $('lOk').click(); });
$('btnOut').onclick = () => { document.cookie = 'dz_sid=; Path=/; Max-Age=0'; showLogin(); };
boot();
</script>
